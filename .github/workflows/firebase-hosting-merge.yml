name: Deploy Jolly Chubby Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-live
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build:blog && node scripts/prepare-travel-config.mjs
      - name: Check published text for legacy branding and personal identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          forbidden = re.compile(r'\bPossibility\b|(?i:jay[ ._-]*chen|jaychtw|jay\.yc\.chen)')
          extensions = {'.html', '.css', '.js', '.json', '.xml', '.svg', '.txt', '.md', '.py'}
          for path in Path('public').rglob('*'):
              if path.suffix in extensions and forbidden.search(path.read_text()):
                  raise SystemExit(f'Personal identifier or previous studio name in {path}')
          PY
      - run: test -s public/index.html && test -s public/sitemap.xml
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: jollychubbystudio
          channelId: live
      - name: Verify the crossing game on the live site
        run: |
          npm install --prefix "$RUNNER_TEMP/crossing-check" playwright@1.56.1 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/crossing-check/node_modules" node checks/crossing.cjs
