name: Check Travel Canvas public config
on:
  push:
    branches: [verify/travel-config-source]
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request("https://traveltogether-2a321.web.app/__/firebase/init.json",headers={"Origin":"https://jollychubbystudio.com"})
          with urllib.request.urlopen(req,timeout=15) as r:
              config=json.load(r)
              print("Public configuration",r.status,config.get("projectId"),"App:",config.get("appId"),"CORS:",r.headers.get("Access-Control-Allow-Origin"),"key present:",bool(config.get("apiKey")))
          PY
