name: Verify first live studio release
on:
  push:
    branches: [verify/first-live-release]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/verify" playwright@1.56.1 --no-audit --no-fund
      - name: Check alternate domain independently
        id: alias
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import subprocess
          from urllib.parse import urlsplit
          for path in ["/", "/privacy"]:
              start = "https://jollychubby.com"+path
              cmd = ["curl","-sS","--max-time","45","--location","--max-redirs","8","--proto-redir","=https","-D","-","-o","/dev/null","-w","FINAL %{http_code} %{url_effective} %{num_redirects}","--",start]
              res = subprocess.run(cmd,capture_output=True,text=True)
              print(start, res.stderr, flush=True)
              print("\n".join(l for l in res.stdout.splitlines() if l.lower().startswith(("http/","location:","final "))), flush=True)
              if res.returncode or not res.stdout.splitlines()[-1].startswith("FINAL 200 https://jollychubbystudio.com"+path+" "): raise SystemExit(1)
          PY
      - name: Verify published page content and live collector response
        run: |
          python3 - <<'PY'
          import urllib.request as u, hashlib, json, time
          from pathlib import Path
          from datetime import datetime, timezone
          root = 'https://jollychubbystudio.com'
          for path, file in [('/','index.html'),('/privacy','privacy.html'),('/terms','terms.html'),('/travelcanvas/','travelcanvas/index.html'),('/wdic/','wdic/index.html'),('/carrier-battle-group/module-2/','carrier-battle-group/module-2/index.html'),('/pedestrian-living-hell/crossing/','pedestrian-living-hell/crossing/index.html')]:
              with u.urlopen(root+path,timeout=30) as r:
                  assert r.status == 200 and r.url == root+path
                  assert r.read() == Path('public',file).read_bytes(), path
                  print(path, '200 exact release content')
          with u.urlopen(root+'/wdic/events.json',timeout=30) as r:
              data=json.load(r)
              print('WDIC source',r.url,'generated',datetime.fromtimestamp(data['generated'],timezone.utc).isoformat(),'events',len(data['events']))
              assert r.url == 'https://jaychtw.github.io/wdic/events.json'
              assert 0 <= time.time()-data['generated'] < 3*3600
          PY
      - name: Exercise live module routes and anonymous sign-in in Chromium
        if: ${{ !cancelled() }}
        env:
          STUDIO_ORIGIN: https://jollychubbystudio.com
        run: |
          export NODE_PATH="$RUNNER_TEMP/verify/node_modules"
          node checks/routes.cjs
      - name: Require clean alternate domain redirect
        if: steps.alias.outcome == 'failure'
        run: exit 1
