<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.7" fill="#719789"/></pattern></defs><rect width="960" height="540" fill="#214c44"/><rect width="960" height="540" fill="url(#grid)"/><circle cx="695" cy="263" r="208" fill="#e7b75d"/><g fill="#fff2d7" font-family="Georgia,serif" font-weight="bold"><text x="56" y="243" font-size="83">Optimistic</text><text x="50" y="362" font-size="148">Bob</text></g><path d="M60 398h342" stroke="#dbb367" stroke-width="3"/><text x="60" y="437" fill="#f3d39c" font-family="monospace" font-size="25" letter-spacing="4">UNIT OB-3000</text><svg x="466" y="16" width="438" height="514" viewBox="0 0 300 360">
                    <defs>
                        <!-- Linear & Radial Gradients for 1950s Retro Shading -->
                        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#14b8a6"/>
                            <stop offset="100%" stop-color="#0f766e"/>
                        </linearGradient>
                        <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#fde047"/>
                            <stop offset="100%" stop-color="#eab308"/>
                        </linearGradient>
                        <linearGradient id="crtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#1e293b"/>
                            <stop offset="100%" stop-color="#0f172a"/>
                        </linearGradient>
                        <linearGradient id="metalArm" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#94a3b8"/>
                            <stop offset="50%" stop-color="#cbd5e1"/>
                            <stop offset="100%" stop-color="#64748b"/>
                        </linearGradient>
                    </defs>

                    <!-- UNICYCLE WHEEL & SPRING SUSPENSION -->
                    <g id="robotBase">
                        <!-- Lower Spring -->
                        <path d="M150,270 Q140,280 150,290 T150,310 T150,325" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
                        <!-- Wheel Fork -->
                        <path d="M135,315 L150,325 L165,315" fill="none" stroke="#475569" stroke-width="5"/>
                        <!-- Rubber Tire -->
                        <circle cx="150" cy="332" r="20" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
                        <circle cx="150" cy="332" r="10" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
                        <circle cx="150" cy="332" r="4" fill="#0f172a"/>
                    </g>

                    <!-- LEFT ARM (Viewer's Left) -->
                    <g id="leftArm" class="transition-all duration-500 origin-[100px_170px]">
                        <!-- Default Idle: resting down -->
                        <path id="leftArmPath" d="M100,175 C70,185 60,210 65,235" fill="none" stroke="url(#metalArm)" stroke-width="14" stroke-linecap="round"/>
                        <!-- Glove / Hand Left -->
                        <path id="leftHand" d="M55,235 C50,245 70,255 75,245 C80,235 60,225 55,235" fill="#facc15" stroke="#0f172a" stroke-width="3"/>
                    </g>

                    <!-- RIGHT ARM (Viewer's Right) -->
                    <g id="rightArm" class="transition-all duration-500 origin-[200px_170px]">
                        <!-- Default Idle: resting down -->
                        <path id="rightArmPath" d="M200,175 C230,185 240,210 235,235" fill="none" stroke="url(#metalArm)" stroke-width="14" stroke-linecap="round"/>
                        <!-- Glove / Hand Right -->
                        <path id="rightHand" d="M245,235 C250,245 230,255 225,245 C220,235 240,225 245,235" fill="#facc15" stroke="#0f172a" stroke-width="3"/>
                    </g>

                    <!-- MAIN TORSO -->
                    <g id="robotBody">
                        <!-- Main Chassis Box -->
                        <rect x="90" y="140" width="120" height="130" rx="16" fill="url(#bodyGrad)" stroke="#0f172a" stroke-width="5"/>
                        
                        <!-- Yellow Front Chest Plate -->
                        <rect x="102" y="152" width="96" height="106" rx="10" fill="url(#yellowGrad)" stroke="#0f172a" stroke-width="3"/>

                        <!-- Hazard Stripe Accent Bar -->
                        <g clip-path="url(#hazardClip)">
                            <clipPath id="hazardClip">
                                <rect x="106" y="234" width="88" height="18" rx="4"/>
                            </clipPath>
                            <rect x="100" y="230" width="100" height="25" class="hazard-stripes"/>
                        </g>

                        <!-- HYPE LEVEL ANALOG GAUGE -->
                        <g id="hypeGauge" transform="translate(110, 162)">
                            <!-- Dial Outer Frame -->
                            <rect x="0" y="0" width="80" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
                            <!-- Dial Face -->
                            <path d="M10,40 A35,35 0 0,1 70,40 Z" fill="#f8fafc"/>
                            
                            <!-- Color Zones on Dial: Green (left), Yellow (mid), Red (max) -->
                            <path d="M15,38 A30,30 0 0,1 32,18" fill="none" stroke="#22c55e" stroke-width="5"/>
                            <path d="M32,18 A30,30 0 0,1 52,18" fill="none" stroke="#eab308" stroke-width="5"/>
                            <path d="M52,18 A30,30 0 0,1 68,38" fill="none" stroke="#ef4444" stroke-width="5"/>

                            <!-- Gauge Label -->
                            <text x="40" y="44" text-anchor="middle" font-family="monospace" font-size="6" font-weight="bold" fill="#94a3b8">HYPE LEVEL</text>
                            
                            <!-- ROTATING NEEDLE -->
                            <!-- Needle Pivot at (40, 40). Rotation angles: Idle ~20deg, Processing ~70deg, Hype ~140deg, Glitch ~-30deg/twitch -->
                            <g id="needleGroup" class="gauge-needle" style="transform: rotate(20deg); transform-origin: 40px 40px;">
                                <polygon points="38,40 42,40 40,12" fill="#ef4444"/>
                                <circle cx="40" cy="40" r="4" fill="#0f172a"/>
                            </g>
                        </g>

                        <!-- Chest Indicator Lights & Toggle Switches -->
                        <circle cx="120" cy="222" r="4" fill="#ef4444" stroke="#0f172a" stroke-width="1.5"/>
                        <circle cx="132" cy="222" r="4" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
                        <rect x="160" y="218" width="12" height="8" rx="2" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
                        <line x1="166" y1="218" x2="166" y2="223" stroke="#facc15" stroke-width="2"/>
                    </g>

                    <!-- NECK SPRING -->
                    <g id="robotNeck">
                        <path d="M135,130 Q150,125 165,130 M135,136 Q150,131 165,136" fill="none" stroke="#475569" stroke-width="4"/>
                    </g>

                    <!-- CRT MONITOR HEAD & ANTENNA -->
                    <g id="robotHead">
                        <!-- RADAR DISH EARS -->
                        <!-- Left Ear Dish -->
                        <path d="M72,75 C60,65 60,95 72,85" fill="#94a3b8" stroke="#0f172a" stroke-width="3"/>
                        <line x1="72" y1="80" x2="85" y2="80" stroke="#0f172a" stroke-width="3"/>
                        
                        <!-- Right Ear Dish -->
                        <path d="M228,75 C240,65 240,95 228,85" fill="#94a3b8" stroke="#0f172a" stroke-width="3"/>
                        <line x1="228" y1="80" x2="215" y2="80" stroke="#0f172a" stroke-width="3"/>

                        <!-- ANTENNA -->
                        <path id="antennaCoil" d="M150,45 Q143,35 150,28 T150,15" fill="none" stroke="#64748b" stroke-width="4"/>
                        <!-- Antenna Light Bulb at Top (150, 10) -->
                        <circle id="antennaBulb" cx="150" cy="10" r="8" fill="#facc15" stroke="#0f172a" stroke-width="2" class="drop-shadow-[0_0_8px_#facc15]"/>

                        <!-- CRT Head Outer Shell -->
                        <rect x="80" y="45" width="140" height="90" rx="18" fill="url(#bodyGrad)" stroke="#0f172a" stroke-width="5"/>
                        
                        <!-- Inner Bezel -->
                        <rect x="92" y="55" width="116" height="70" rx="12" fill="#334155" stroke="#0f172a" stroke-width="3"/>
                        
                        <!-- CRT Screen Glass -->
                        <rect x="98" y="60" width="104" height="60" rx="8" fill="url(#crtGrad)" stroke="#0f172a" stroke-width="2"/>

                        <!-- CRT DISPLAY CONTENTS BY STATE -->
                        <g id="crtDisplay">
                            
                            <!-- STATE 1: IDLE DISPLAY (Cyan pixel eyes + smile) -->
                            <g id="screenIdle" display="none">
                                <!-- Eye Left -->
                                <rect x="116" y="76" width="14" height="14" rx="2" fill="#38bdf8"/>
                                <!-- Eye Right -->
                                <rect x="170" y="76" width="14" height="14" rx="2" fill="#38bdf8"/>
                                <!-- Pixel Smile -->
                                <path d="M126,104 L174,104" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
                            </g>

                            <!-- STATE 2: PROCESSING DISPLAY (Spinning Loader dots) -->
                            <g id="screenProcessing" display="none">
                                <text x="150" y="88" text-anchor="middle" font-family="monospace" font-size="12" fill="#facc15" font-weight="bold">THINKING...</text>
                                <!-- Animated dots indicator -->
                                <g transform="translate(130, 96)">
                                    <circle cx="0" cy="0" r="4" fill="#38bdf8" class="animate-ping"/>
                                    <circle cx="20" cy="0" r="4" fill="#38bdf8" class="animate-ping delay-100"/>
                                    <circle cx="40" cy="0" r="4" fill="#38bdf8" class="animate-ping delay-200"/>
                                </g>
                            </g>

                            <!-- STATE 3: HYPE BURST DISPLAY (Star Eyes + Equalizer Bars) -->
                            <g id="screenHype">
                                <!-- Left Star Eye <* -->
                                <text x="122" y="86" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#facc15">★</text>
                                <!-- Right Star Eye *> -->
                                <text x="178" y="86" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#facc15">★</text>
                                
                                <!-- Bouncing Cyan Equalizer Audio Bars at Bottom of Screen -->
                                <g id="equalizerBars" transform="translate(0 110)">
                                    <rect x="112" y="-18" width="6" height="16" fill="#38bdf8" class="eq-1"/>
                                    <rect x="126" y="-18" width="6" height="16" fill="#38bdf8" class="eq-2"/>
                                    <rect x="140" y="-18" width="6" height="16" fill="#38bdf8" class="eq-3"/>
                                    <rect x="154" y="-18" width="6" height="16" fill="#38bdf8" class="eq-4"/>
                                    <rect x="168" y="-18" width="6" height="16" fill="#38bdf8" class="eq-5"/>
                                    <rect x="182" y="-18" width="6" height="16" fill="#38bdf8" class="eq-1"/>
                                </g>
                            </g>

                            <!-- STATE 4: MALFUNCTION DISPLAY (Mismatched X and spiral O + glitch line) -->
                            <g id="screenMalfunction" display="none">
                                <!-- Eye Left X -->
                                <text x="120" y="88" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ef4444">✕</text>
                                <!-- Eye Right Spiral O -->
                                <text x="180" y="88" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ef4444">◎</text>
                                <!-- Jagged Teeth Mouth -->
                                <path d="M120,104 L130,98 L140,106 L150,98 L160,106 L170,98 L180,104" fill="none" stroke="#ef4444" stroke-width="3"/>
                            </g>
                        </g>

                        <!-- Knob Details on Head Frame -->
                        <circle cx="208" cy="70" r="3" fill="#0f172a"/>
                        <circle cx="208" cy="80" r="3" fill="#0f172a"/>
                    </g>
                </svg></svg>