<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CVN-78 Carrier Strike Group — 3D Ocean Sandbox</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07131f;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    .glass-panel {
      background: rgba(8, 19, 32, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 210, 255, 0.18);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .btn-pill {
      transition: all 0.18s ease;
    }
    .btn-pill:hover {
      transform: translateY(-1px);
      background: rgba(56, 189, 248, 0.25);
      border-color: rgba(125, 211, 252, 0.55);
    }
    .btn-pill:active {
      transform: translateY(0px) scale(0.97);
    }
    .btn-active {
      background: rgba(14, 165, 233, 0.38) !important;
      border-color: rgba(125, 211, 252, 0.85) !important;
      color: #ffffff !important;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
    }
    .hud-fade {
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    .toast-enter {
      animation: toastSlide 0.28s ease forwards;
    }
    @keyframes toastSlide {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    /* Custom subtle range slider */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(148, 210, 255, 0.25);
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      border: 2px solid #e0f2fe;
    }
  </style>
</head>
<body class="text-slate-100">
  <!-- Fullscreen 3D Viewport -->
  <div id="canvas-container"></div>

  <!-- Top Bar: Title, Ops Telemetry, Language & Audio Controls -->
  <header class="fixed top-3 left-3 right-3 z-20 flex flex-wrap items-start justify-between gap-2 pointer-events-none">
    <!-- Left: Carrier Title & Live Ops Counters -->
    <div class="glass-panel rounded-2xl px-3.5 py-2.5 pointer-events-auto flex items-center gap-3.5 max-w-full">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-sky-500/20 border border-sky-400/40 flex items-center justify-center text-sky-300 font-bold text-xs tracking-wider shrink-0">
          78
        </div>
        <div class="min-w-0">

          <p id="ui-subtitle" class="text-[11px] text-sky-200/75 leading-tight truncate">

    <!-- Right: Quick Toggles (Language, Sound, Auto-Ops, Hide HUD) -->
    <div class="flex items-center gap-1.5 pointer-events-auto">

      </div>

      <div class="hidden md:block w-px h-6 bg-sky-300/20"></div>

      <!-- Camera Views -->

        <button id="cam-orbit" data-cam="orbit" type="button" class="cam-btn btn-pill btn-active rounded-lg px-2.5 py-1.5 text-[11px] font-medium border border-transparent">Orbit</button>

  (function () {

        langBtn: 'English',

        hint: '拖曳旋轉視角 • 滾輪縮放 • 點擊甲板起飛 • 點擊海面產生波紋 • 點擊戰機跟拍',

        camBridge: '艦島塔台',
        camChase: '戰機跟拍',
        camConvoy: '護衛艦隊',
        envSunset: '黃金日落',
        envNoon: '晴朗正午',

        envNight: '夜間巡航',
        waves: '海浪',
        msgLaunch: (cs, cat) => `${cs} 正從第 ${cat} 號電磁彈射器起飛`,
        msgNoDeckJet: '目前所有戰機皆在空中或準備起飛中',
        msgRecover: (cs) => `${cs} 已獲准進場，準備勾索降落斜角甲板`,
        msgNoAirJet: '目前空中無巡航戰機，請先彈射起飛',
        msgScramble: '緊急升空！連續電磁彈射序列啟動',
        msgTrap: (cs) => `${cs} 成功勾住第 3 號攔阻索！`,
        msgFollow: (cs) => `正在跟拍 ${cs} — 隨時可切換其他視角`,
        msgRipple: '海面激起擴散波紋'
      }
    };

    let lang = 'en';
    try {
      const saved = localStorage.getItem('cvn78_lang');
      if (saved === 'en' || saved === 'zh') lang = saved;
    } catch (e) {}

    // =========================================================================
    // 2. WEB AUDIO PROCEDURAL SOUNDSCAPE
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.masterGain = null;
        this.oceanFilter = null;
        this.oceanGain = null;
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.0;
        this.masterGain.connect(this.ctx.destination);

        // Pink-ish noise buffer for continuous ocean surf & wind
        const bufferSize = this.ctx.sampleRate * 3;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.950 * b2 + white * 0.048;
          data[i] = (b0 + b1 + b2 + white * 0.02) * 0.6;
        }
        const oceanSrc = this.ctx.createBufferSource();
        oceanSrc.buffer = noiseBuffer;
        oceanSrc.loop = true;

        this.oceanFilter = this.ctx.createBiquadFilter();
        this.oceanFilter.type = 'lowpass';
        this.oceanFilter.frequency.value = 340;
        this.oceanFilter.Q.value = 0.7;

        this.oceanGain = this.ctx.createGain();
        this.oceanGain.gain.value = 0.24;

        oceanSrc.connect(this.oceanFilter);
        this.oceanFilter.connect(this.oceanGain);
        this.oceanGain.connect(this.masterGain);
        oceanSrc.start();
      }

      setEnabled(flag) {
        this.enabled = flag;
        if (flag) {
          this.init();
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          if (this.masterGain && this.ctx) {
            this.masterGain.gain.setTargetAtTime(0.65, this.ctx.currentTime, 0.25);
          }
        } else if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(0.0, this.ctx.currentTime, 0.2);
        }
      }

      updateAmbience(swell, isStorm) {
        if (!this.enabled || !this.ctx || !this.oceanFilter) return;
        const targetFreq = isStorm ? 620 : 280 + swell * 120;
        const targetVol = isStorm ? 0.36 : 0.18 + swell * 0.06;
        this.oceanFilter.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.4);
        this.oceanGain.gain.setTargetAtTime(targetVol, this.ctx.currentTime, 0.4);
      }

      playCatapultLaunch() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;

        // Filtered noise whoosh + jet afterburner roar
        const dur = 2.4;
        const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;

        const src = this.ctx.createBufferSource();
        src.buffer = buf;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(220, now);
        filter.frequency.exponentialRampToValueAtTime(1400, now + 0.9);
        filter.frequency.exponentialRampToValueAtTime(320, now + dur);
        filter.Q.value = 1.2;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.32, now + 0.35);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        src.start(now);

        // EMALS electromagnetic whine
        const osc = this.ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.85);
        const oGain = this.ctx.createGain();
        oGain.gain.setValueAtTime(0.001, now);
        oGain.gain.linearRampToValueAtTime(0.06, now + 0.2);
        oGain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
        osc.connect(oGain);
        oGain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 1.0);
      }

      playTrapLanding() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        // Deck touchdown thump + arrestor cable zip
        const osc = this.ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(135, now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.25);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.3);
      }

      playWaterPulse() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(95, now + 0.35);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    const sound = new SoundEngine();

    // =========================================================================
    // 3. SHARED GERSTNER WAVE PHYSICS (EXACT MATCH BETWEEN CPU & GLSL SHADER)
    // =========================================================================
    // Each wave: [dirX, dirZ, steepness, wavelength, speed]
    const WAVES = [
      { dx: 0.88, dz: 0.47, steep: 0.22, len: 58.0, speed: 1.15 },
      { dx: 0.42, dz: -0.91, steep: 0.16, len: 34.0, speed: 1.35 },
      { dx: -0.78, dz: 0.62, steep: 0.12, len: 21.0, speed: 1.65 },
      { dx: 0.25, dz: 0.96, steep: 0.08, len: 12.5, speed: 1.95 }
    ];

    function sampleOceanHeight(x, z, time, swellScale) {
      let y = 0;
      for (let i = 0; i < WAVES.length; i++) {
        const w = WAVES[i];
        const k = (2.0 * Math.PI) / w.len;
        const c = Math.sqrt(9.8 / k) * w.speed;
        const a = (w.steep * swellScale) / k;
        const f = k * (w.dx * x + w.dz * z - c * time);
        y += a * Math.sin(f);
      }
      return y;
    }

    // =========================================================================
    // 4. ENVIRONMENT PRESETS (SUNSET, NOON, STORM, NIGHT)
    // =========================================================================
    const ENVS = {
      sunset: {
        sunDir: new THREE.Vector3(-0.62, 0.17, -0.76).normalize(),
        skyTop: new THREE.Color(0x0f2747),
        skyMid: new THREE.Color(0x3a5a85),
        skyHorizon: new THREE.Color(0xf29f67),
        sunColor: new THREE.Color(0xffd29d),
        waterDeep: new THREE.Color(0x051c33),
        waterShallow: new THREE.Color(0x0e5b73),
        fogColor: new THREE.Color(0xc98a6c),
        fogDensity: 0.00072,
        sunIntensity: 1.55,
        hemiSky: 0xffc699,
        hemiGround: 0x102840,
        hemiIntensity: 0.85,
        nightFactor: 0.05,
        stormFactor: 0.0,
        defaultSwell: 1.0
      },
      noon: {
        sunDir: new THREE.Vector3(0.35, 0.78, -0.52).normalize(),
        skyTop: new THREE.Color(0x1464b8),
        skyMid: new THREE.Color(0x4fa3e3),
        skyHorizon: new THREE.Color(0xbce3fa),
        sunColor: new THREE.Color(0xfffbe8),
        waterDeep: new THREE.Color(0x04294f),
        waterShallow: new THREE.Color(0x0c88a8),
        fogColor: new THREE.Color(0xa6d2ed),
        fogDensity: 0.00058,
        sunIntensity: 1.75,
        hemiSky: 0xd8f0ff,
        hemiGround: 0x164a6e,
        hemiIntensity: 1.05,
        nightFactor: 0.0,
        stormFactor: 0.0,
        defaultSwell: 0.85
      },
      storm: {
        sunDir: new THREE.Vector3(-0.3, 0.35, -0.88).normalize(),

    // =========================================================================
    // 5. CUSTOM GLSL SHADERS (OCEAN + SKY DOME)
    // =========================================================================
    const SKY_VERTEX_SHADER = `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const SKY_FRAGMENT_SHADER = `
      uniform vec3 uSunDir;
      uniform vec3 uSkyTop;
      uniform vec3 uSkyMid;
      uniform vec3 uSkyHorizon;
      uniform vec3 uSunColor;
      uniform float uTime;
      uniform float uNightFactor;
      uniform float uStormFactor;
      varying vec3 vWorldPos;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 4; i++) {
          v += a * noise(p);
          p *= 2.04;
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec3 dir = normalize(vWorldPos);
        float h = clamp(dir.y, 0.0, 1.0);

        // Multi-band atmospheric gradient
        vec3 col = mix(uSkyHorizon, uSkyMid, smoothstep(0.0, 0.28, h));
        col = mix(col, uSkyTop, smoothstep(0.22, 0.85, h));

        // Sun / Moon disc & Mie scattering glow
        float sunAmt = max(dot(dir, normalize(uSunDir)), 0.0);
        float mie = pow(sunAmt, 10.0) * (0.45 - 0.3 * uStormFactor);
        float disc = smoothstep(0.9985, 0.9996, sunAmt) * (1.0 - 0.85 * uStormFactor);
        col += uSunColor * (mie + disc * 1.6);

        // Soft drifting clouds
        if (dir.y > 0.02) {
          vec2 uv = dir.xz / (dir.y + 0.16) * 0.9 + vec2(uTime * 0.008, uTime * 0.004);
          float c = fbm(uv);
          float cloudMask = smoothstep(0.46 - uStormFactor * 0.22, 0.78, c) * smoothstep(0.02, 0.2, dir.y);
          vec3 cloudBright = mix(vec3(0.95, 0.93, 0.92), uSkyHorizon * 1.15, 0.45);
          vec3 cloudDark = mix(uSkyMid * 0.7, vec3(0.16, 0.21, 0.28), uStormFactor);
          vec3 cloudCol = mix(cloudDark, cloudBright, 0.5 + 0.5 * pow(sunAmt, 3.0));
          cloudCol = mix(cloudCol, vec3(0.1, 0.17, 0.28), uNightFactor * 0.75);
          col = mix(col, cloudCol, cloudMask * (0.55 + 0.35 * uStormFactor));
        }

        // Subtle starfield at night
        if (uNightFactor > 0.2 && dir.y > 0.08) {
          vec2 starUV = floor(dir.xz / (dir.y + 0.15) * 180.0);
          float s = hash(starUV);
          if (s > 0.994) {
            float twinkle = 0.65 + 0.35 * sin(uTime * 3.0 + s * 60.0);
            col += vec3(0.85, 0.92, 1.0) * twinkle * uNightFactor * smoothstep(0.08, 0.35, dir.y);
          }
        }

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const OCEAN_VERTEX_SHADER = `
      uniform float uTime;
      uniform float uSwell;
      uniform vec4 uRipples[4];
      varying vec3 vWorldPos;
      varying vec3 vNormal;
      varying float vFoam;

      vec3 gerstnerWave(vec2 dir, float steepness, float wavelength, float speed, vec3 p, inout vec3 tangent, inout vec3 binormal) {
        float k = 6.2831853 / wavelength;
        float c = sqrt(9.8 / k) * speed;
        vec2 d = normalize(dir);
        float f = k * (dot(d, p.xz) - c * uTime);
        float a = (steepness * uSwell) / k;

        tangent += vec3(
          -d.x * d.x * (steepness * uSwell * sin(f)),
          d.x * (steepness * uSwell * cos(f)),
          -d.x * d.y * (steepness * uSwell * sin(f))
        );
        binormal += vec3(
          -d.x * d.y * (steepness * uSwell * sin(f)),
          d.y * (steepness * uSwell * cos(f)),
          -d.y * d.y * (steepness * uSwell * sin(f))
        );

        return vec3(
          d.x * (a * cos(f)),
          a * sin(f),
          d.y * (a * cos(f))
        );
      }

      void main() {
        vec3 basePos = (modelMatrix * vec4(position, 1.0)).xyz;
        vec3 tangent = vec3(1.0, 0.0, 0.0);
        vec3 binormal = vec3(0.0, 0.0, 1.0);
        vec3 disp = vec3(0.0);

        disp += gerstnerWave(vec2(0.88, 0.47), 0.22, 58.0, 1.15, basePos, tangent, binormal);
        disp += gerstnerWave(vec2(0.42, -0.91), 0.16, 34.0, 1.35, basePos, tangent, binormal);
        disp += gerstnerWave(vec2(-0.78, 0.62), 0.12, 21.0, 1.65, basePos, tangent, binormal);
        disp += gerstnerWave(vec2(0.25, 0.96), 0.08, 12.5, 1.95, basePos, tangent, binormal);

        // Interactive click ripples
        float rippleFoam = 0.0;
        for (int i = 0; i < 4; i++) {
          vec4 rp = uRipples[i];
          if (rp.w > 0.01) {
            float age = uTime - rp.z;
            if (age > 0.0 && age < 6.0) {
              float dist = length(basePos.xz - rp.xy);
              float radius = age * 28.0;
              float band = exp(-pow((dist - radius) * 0.11, 2.0));
              float decay = exp(-age * 0.55) * rp.w;
              float wave = sin((dist - radius) * 0.65) * band * decay * 1.8;
              disp.y += wave;
              rippleFoam += band * decay * 0.85;
            }
          }
        }

        vec3 finalWorld = basePos + disp;
        vWorldPos = finalWorld;
        vNormal = normalize(cross(binormal, tangent));
        vFoam = clamp((disp.y / max(uSwell * 1.4, 0.5)) * 0.55 + rippleFoam, 0.0, 1.0);

        gl_Position = projectionMatrix * viewMatrix * vec4(finalWorld, 1.0);
      }
    `;

    const OCEAN_FRAGMENT_SHADER = `
      uniform float uTime;
      uniform float uSwell;
      uniform vec3 uSunDir;
      uniform vec3 uSunColor;
      uniform vec3 uSkyHorizon;
      uniform vec3 uSkyTop;
      uniform vec3 uWaterDeep;
      uniform vec3 uWaterShallow;
      uniform vec3 uFogColor;
      uniform float uFogDensity;
      uniform float uNightFactor;
      uniform vec4 uShips[7]; // x, z, lengthScale, beamScale
      varying vec3 vWorldPos;
      varying vec3 vNormal;
      varying float vFoam;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
          f.y
        );
      }

      void main() {
        // High-frequency micro-ripple normal perturbation (sailing forward along -Z)
        vec2 p = vWorldPos.xz;
        vec2 flow = vec2(0.0, -uTime * 6.5);
        float n1 = noise((p + flow) * 0.22 + vec2(uTime * 0.35, -uTime * 0.25));
        float n2 = noise((p + flow) * 0.52 - vec2(uTime * 0.22, uTime * 0.41));
        vec3 detailNorm = normalize(vec3((n1 - 0.5) * 0.26, 1.0, (n2 - 0.5) * 0.26));
        vec3 N = normalize(mix(vNormal, detailNorm, 0.35));

        vec3 V = normalize(cameraPosition - vWorldPos);
        vec3 L = normalize(uSunDir);

        // Fresnel reflection
        float fresnel = pow(1.0 - max(dot(N, V), 0.0), 4.0);
        fresnel = clamp(0.04 + 0.96 * fresnel, 0.0, 1.0);

        // Subsurface scattering turquoise glow on backlit wave crests
        float sss = pow(max(dot(V, -L + N * 0.45), 0.0), 3.0) * (0.4 + 0.6 * vFoam) * (1.0 - uNightFactor * 0.8);
        vec3 baseWater = mix(uWaterDeep, uWaterShallow, clamp(0.25 + vFoam * 0.45, 0.0, 1.0));
        baseWater += vec3(0.04, 0.38, 0.42) * sss;

        // Sky reflection color
        vec3 R = reflect(-V, N);
        vec3 skyRefl = mix(uSkyHorizon, uSkyTop, clamp(R.y * 1.4, 0.0, 1.0));
        vec3 color = mix(baseWater, skyRefl, fresnel * 0.78);

        // Crisp sun / moon specular glitter
        vec3 H = normalize(L + V);
        float specTight = pow(max(dot(N, H), 0.0), 260.0) * 2.2;
        float specBroad = pow(max(dot(N, H), 0.0), 24.0) * 0.22;
        color += uSunColor * (specTight + specBroad);

        // Dynamic Kelvin V-wakes & long turquoise-tinted stern prop-wash trails (Carrier + 6 Escorts)
        float wakeFoam = 0.0;
        float wakeTurquoise = 0.0;
        for (int i = 0; i < 7; i++) {
          vec4 sh = uShips[i];
          float dx = vWorldPos.x - sh.x;
          float dz = vWorldPos.z - sh.y; // > 0 is behind the ship
          float halfLen = sh.z;
          float halfBeam = sh.w;

          // Bow wave & hull collar
          float bowDist = length(vec2(dx / (halfBeam * 1.25), (dz + halfLen * 0.85) / (halfBeam * 1.5)));
          float bowFoam = smoothstep(1.35, 0.52, bowDist) * 0.82;

          // Long trailing stern turbulent prop wash + Kelvin V-arms
          if (dz > -halfLen * 0.4 && dz < halfLen * 14.0) {
            float behind = max(dz + halfLen * 0.2, 0.0);
            float fade = exp(-behind / (halfLen * 6.5));
            float centerWidth = halfBeam * (0.78 + behind * 0.015);
            float centerTrail = exp(-pow(dx / centerWidth, 2.0)) * fade;
            float coreTurq = exp(-pow(dx / (centerWidth * 1.45), 2.0)) * exp(-behind / (halfLen * 8.5));

            // V-wake arms (~19.5 deg Kelvin angle)
            float armOffset = halfBeam * 0.88 + behind * 0.26;
            float armWidth = halfBeam * 0.36 + behind * 0.032;
            float vArm = exp(-pow((abs(dx) - armOffset) / armWidth, 2.0)) * exp(-behind / (halfLen * 4.2)) * 0.65;

            float foamNoise = noise(vec2(dx * 0.26, (dz - uTime * 9.5) * 0.15));
            wakeFoam = max(wakeFoam, (centerTrail * 0.92 + vArm) * (0.52 + 0.68 * foamNoise));
            wakeTurquoise = max(wakeTurquoise, coreTurq * (0.5 + 0.5 * foamNoise));
          }
          wakeFoam = max(wakeFoam, bowFoam * (0.65 + 0.35 * n2));
        }

        // Blend aerated turquoise subsurface bubble wake before white foam
        vec3 turqColor = mix(vec3(0.14, 0.58, 0.68), vec3(0.05, 0.20, 0.30), uNightFactor * 0.8);
        color = mix(color, turqColor, clamp(wakeTurquoise * 0.58, 0.0, 0.65));

        // Whitecap foam on high crests + ship wakes
        float crestFoam = smoothstep(0.56, 0.92, vFoam + n1 * 0.22) * (0.45 + 0.35 * uSwell);
        float totalFoam = clamp(max(crestFoam, wakeFoam), 0.0, 1.0);
        vec3 foamColor = mix(vec3(0.94, 0.97, 1.0), uSkyHorizon * 0.82 + vec3(0.28), 0.32);
        foamColor = mix(foamColor, vec3(0.32, 0.45, 0.6), uNightFactor * 0.75);
        color = mix(color, foamColor, totalFoam * 0.86);

        // Distance exponential fog matching sky horizon
        float dist = length(cameraPosition - vWorldPos);
        float fogFactor = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
        color = mix(color, uFogColor, clamp(fogFactor, 0.0, 1.0));

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    // Seamless lofted naval hull geometry (watertight, zero detached bow pieces)
    function createLoftedHullGeometry(stations) {
      const positions = [];
      const indices = [];
      const ringSize = 5;

      for (let i = 0; i < stations.length; i++) {
        const st = stations[i];
        const z = st.z;
        const yb = st.yBottom;
        const yt = st.yTop;
        const wb = st.halfBeamBottom;
        const wt = st.halfBeamTop;
        positions.push(
          wt, yt, z,       // 0: starboard deck edge
          wb, yb, z,       // 1: starboard bilge
          0, yb - 0.15, z, // 2: keel
          -wb, yb, z,      // 3: port bilge
          -wt, yt, z       // 4: port deck edge
        );
      }

      // Connect hull sides & bottom between stations (ordered stern +Z to bow -Z, CCW outward normals)
      for (let i = 0; i < stations.length - 1; i++) {
        const a = i * ringSize;
        const b = (i + 1) * ringSize;
        for (let k = 0; k < ringSize - 1; k++) {
          indices.push(a + k, a + k + 1, b + k);
          indices.push(a + k + 1, b + k + 1, b + k);
        }
        // Top deck strip between port-top (4) and starboard-top (0)
        indices.push(a + 4, a + 0, b + 4);
        indices.push(a + 0, b + 0, b + 4);
      }

      // Cap stern (station 0, outward +Z)
      indices.push(0, 2, 1, 0, 3, 2, 0, 4, 3);
      // Cap bow (last station, outward -Z)
      const last = (stations.length - 1) * ringSize;
      indices.push(last + 0, last + 1, last + 2, last + 0, last + 2, last + 3, last + 0, last + 3, last + 4);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function buildCarrier() {
      const group = new THREE.Group();
      // Authentic US Navy CVN-78 Haze Gray, Black waterline boot-top, Crimson anti-fouling bottom
      const hullMat = new THREE.MeshStandardMaterial({ color: 0x8b96a1, roughness: 0.65, metalness: 0.22 });
      const darkHullMat = new THREE.MeshStandardMaterial({ color: 0x525d68, roughness: 0.78, metalness: 0.22 });
      const bootBlackMat = new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.85, metalness: 0.1 });
      const redBottomMat = new THREE.MeshStandardMaterial({ color: 0x8e1e1e, roughness: 0.74, metalness: 0.12 });
      const deckMat = new THREE.MeshStandardMaterial({
        map: createFlightDeckTexture(),
        roughness: 0.86,
        metalness: 0.12
      });
      const domeMat = new THREE.MeshStandardMaterial({ color: 0xe6edf5, roughness: 0.35, metalness: 0.1 });
      const railMat = new THREE.MeshStandardMaterial({ color: 0xb6c0ca, roughness: 0.6, metalness: 0.4 });

    // Seamless chined stealth fighter fuselage loft (watertight, zero gaps between nose & body)
    function createFighterFuselageGeometry(stations) {
      // Each station: { z, yBot, yChine, yTop, wBot, wChine, wTop }
      // 6-vertex ring around cross-section (starboard-top -> stbd-chine -> stbd-bot -> port-bot -> port-chine -> port-top)
      const positions = [];
      const indices = [];
      const ring = 6;

      for (let i = 0; i < stations.length; i++) {
        const st = stations[i];
        positions.push(
          st.wTop,   st.yTop,   st.z, // 0: stbd spine
          st.wChine, st.yChine, st.z, // 1: stbd chine
          st.wBot,   st.yBot,   st.z, // 2: stbd belly
          -st.wBot,  st.yBot,   st.z, // 3: port belly
          -st.wChine,st.yChine, st.z, // 4: port chine
          -st.wTop,  st.yTop,   st.z  // 5: port spine
        );
      }

      // Connect stations from tail (+Z) to nose (-Z) with outward CCW normals
      for (let i = 0; i < stations.length - 1; i++) {
        const a = i * ring;
        const b = (i + 1) * ring;
        for (let k = 0; k < ring; k++) {
          const kn = (k + 1) % ring;
          indices.push(a + k, a + kn, b + k);
          indices.push(a + kn, b + kn, b + k);
        }
      }

      // Cap aft (+Z)
      indices.push(0, 2, 1, 0, 3, 2, 0, 4, 3, 0, 5, 4);
      // Cap nose (-Z)
      const last = (stations.length - 1) * ring;
      indices.push(last + 0, last + 1, last + 2, last + 0, last + 2, last + 3, last + 0, last + 3, last + 4, last + 0, last + 4, last + 5);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

      hTail.position.set(0, 0.92, 2.55);
      root.add(hTail);
      [-1.55, -0.55, 0.55, 1.55].forEach((fx) => {
        const fin = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.05, 0.85), bodyMat);
        fin.position.set(fx, 1.05, 2.55);
        root.add(fin);
      });

      return { root, rotodome, props };
    }

    function buildSeahawk() {
      // MH-60R Seahawk naval helicopter with spinning main & tail rotors
      const root = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x6c7885, roughness: 0.52, metalness: 0.35 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e252e, roughness: 0.5, metalness: 0.65 });
      const rotorMat = new THREE.MeshBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.55 });

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.95, 3.2), bodyMat);
      cabin.position.set(0, 0.68, -0.2);
      root.add(cabin);

      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.56, 10, 8), bodyMat);
      nose.scale.set(1.0, 0.85, 1.45);
      nose.position.set(0, 0.58, -1.85);
      root.add(nose);

      const cockpit = new THREE.Mesh(new THREE.BoxGeometry(1.06, 0.45, 0.95), darkMat);
      cockpit.position.set(0, 0.85, -1.55);
      root.add(cockpit);

      // Tapered tail boom
      const boom = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.34, 3.1, 8), bodyMat);
      boom.rotation.x = Math.PI / 2;
      boom.position.set(0, 0.78, 2.65);
      root.add(boom);

      const tailFin = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.05, 0.65), bodyMat);
      tailFin.position.set(0, 1.15, 4.05);
      tailFin.rotation.x = -0.22;
      root.add(tailFin);

      // Spinning 4-blade Main Rotor
      const mainRotor = new THREE.Group();
      mainRotor.position.set(0, 1.38, -0.35);
      const b1 = new THREE.Mesh(new THREE.BoxGeometry(5.8, 0.04, 0.16), rotorMat);
      const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.04, 5.8), rotorMat);
      mainRotor.add(b1, b2);

      // Spinning Tail Rotor
      const tailRotor = new THREE.Group();
      tailRotor.position.set(0.18, 1.45, 4.12);

      const tb2 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, 1.15), rotorMat);
      tailRotor.add(tb1, tb2);
      root.add(tailRotor);

    // =========================================================================
    // 8. PARTICLE EFFECTS (CATAPULT VAPOR, TIRE SMOKE, AFTERBURNER TRAIL)
    // =========================================================================
    const particleGeo = new THREE.SphereGeometry(0.6, 6, 6);
    function spawnSmoke(pos, vel, colorHex, size, life) {
      if (particles.length > 140) return;
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.65
      });
      const mesh = new THREE.Mesh(particleGeo, mat);
      mesh.position.copy(pos);
      mesh.scale.setScalar(size);
      scene.add(mesh);
      particles.push({ mesh, mat, vel: vel.clone(), life, maxLife: life, grow: 2.2 });
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
          scene.remove(p.mesh);
          p.mat.dispose();
          particles.splice(i, 1);
          continue;
        }
        p.mesh.position.addScaledVector(p.vel, dt);
        p.mesh.scale.addScalar(p.grow * dt);
        p.mat.opacity = (p.life / p.maxLife) * 0.58;
      }
    }

    // =========================================================================
    // 9. FIGHTER JET FLIGHT & DECK PHYSICS CONTROLLER
    // =========================================================================
    const PARKING_SLOTS = [
      { x: 5.4, z: 34.0, rotY: 0.35 },
      { x: 5.8, z: 24.5, rotY: 0.42 },
      { x: 6.2, z: -2.0, rotY: -0.25 },
      { x: -10.8, z: -6.0, rotY: 0.2 },
      { x: -9.8, z: 34.0, rotY: -0.3 }
    ];

    const CALLSIGNS = ['Viper 1', 'Falcon 2', 'Maverick 3', 'Knight 4', 'Ghost 5'];

    function createFighters() {
      for (let i = 0; i < CALLSIGNS.length; i++) {
        const cs = CALLSIGNS[i];
        const model = buildFighterJet(cs);
        scene.add(model.root);

        const slot = PARKING_SLOTS[i];
        const isInitialPatrol = i < 2; // Start with 2 jets already soaring in CAP!
        const fighter = {
          id: i,
          callsign: cs,
          model,
          slotIndex: i,
          state: isInitialPatrol ? 'PATROL' : 'PARKED',
          catapult: (i % 2) + 1,
          stateTimer: 0,
          speed: isInitialPatrol ? 56 : 0,
          orbitAngle: i * Math.PI + 0.6,
          orbitRadius: 125 + i * 28,
          orbitAlt: 42 + i * 12,
          localPos: new THREE.Vector3(slot.x, 6.45, slot.z),
          worldPos: new THREE.Vector3(
            Math.cos(i * Math.PI) * 130,
            42 + i * 12,
            Math.sin(i * Math.PI) * 130
          ),
          vel: new THREE.Vector3(0, 0, -56),
          afterburner: 0
        };
        fighters.push(fighter);
      }
      trackedFighter = fighters[0];
      updateStatsUI();
    }

    function launchFighter(specificFighter) {
      const f = specificFighter || fighters.find((j) => j.state === 'PARKED');
      if (!f) {
        showToast(I18N[lang].msgNoDeckJet);
        return false;
      }
      f.catapult = nextCatapult;
      nextCatapult = nextCatapult === 1 ? 2 : 1;
      f.state = 'TAXI_TO_CAT';
      f.stateTimer = 0;
      showToast(I18N[lang].msgLaunch(f.callsign, f.catapult));
      updateStatsUI();
      return true;
    }

    function recoverFighter() {
      // Only allow 1 jet on final approach at a time for clean deck traffic
      const busy = fighters.some((j) => j.state === 'APPROACH' || j.state === 'LANDING');
      if (busy) return false;
      const f = fighters.find((j) => j.state === 'PATROL');
      if (!f) {
        showToast(I18N[lang].msgNoAirJet);
        return false;
      }
      f.state = 'APPROACH';
      f.stateTimer = 0;
      showToast(I18N[lang].msgRecover(f.callsign));
      updateStatsUI();
      return true;
    }

    function scrambleWing() {
      let launched = 0;
      fighters.forEach((f, idx) => {
        if (f.state === 'PARKED' && launched < 3) {
          launched++;
          setTimeout(() => {
            if (f.state === 'PARKED') {
              f.catapult = (idx % 2) + 1;
              f.state = 'TAXI_TO_CAT';
              f.stateTimer = 0;
              updateStatsUI();
            }
          }, (launched - 1) * 1350);
        }
      });
      if (launched > 0) {
        showToast(I18N[lang].msgScramble);
      } else {
        showToast(I18N[lang].msgNoDeckJet);
      }
    }

    // Helper: transform carrier-local point to world space
    const tmpVec = new THREE.Vector3();
    const tmpVec2 = new THREE.Vector3();

    function carrierToWorld(localVec, out) {
      out.copy(localVec).applyMatrix4(carrierObj.group.matrixWorld);
      return out;
    }

    function updateFighters(dt, elapsed) {
      let cat1Active = false;
      let cat2Active = false;

      for (let i = 0; i < fighters.length; i++) {
        const f = fighters[i];
        const m = f.model;
        f.stateTimer += dt;
        const catX = f.catapult === 1 ? 3.2 : -2.6;

        if (f.state === 'PARKED') {
          const slot = PARKING_SLOTS[f.slotIndex];
          f.localPos.set(slot.x, 6.45, slot.z);
          carrierToWorld(f.localPos, f.worldPos);
          m.root.position.copy(f.worldPos);
          m.root.rotation.copy(carrierObj.group.rotation);
          m.root.rotateY(slot.rotY);
          f.afterburner = THREE.MathUtils.lerp(f.afterburner, 0, dt * 6);
        } else if (f.state === 'TAXI_TO_CAT') {
          const target = new THREE.Vector3(catX, 6.45, -16.5);
          f.localPos.lerp(target, Math.min(1, dt * 1.9));
          carrierToWorld(f.localPos, f.worldPos);
          m.root.position.copy(f.worldPos);
          m.root.rotation.copy(carrierObj.group.rotation);
          f.afterburner = THREE.MathUtils.lerp(f.afterburner, 0.2, dt * 4);

          if (f.catapult === 1) cat1Active = true;
          else cat2Active = true;

          if (f.localPos.distanceTo(target) < 0.8 || f.stateTimer > 2.4) {
            f.localPos.copy(target);
            f.state = 'CAT_READY';
            f.stateTimer = 0;
          }
        } else if (f.state === 'CAT_READY') {
          if (f.catapult === 1) cat1Active = true;
          else cat2Active = true;

          f.localPos.set(catX, 6.45, -16.5);
          carrierToWorld(f.localPos, f.worldPos);
          m.root.position.copy(f.worldPos);
          m.root.rotation.copy(carrierObj.group.rotation);
          // Engine spool-up vibration & afterburner ramp
          m.root.position.x += (Math.random() - 0.5) * 0.06;
          f.afterburner = THREE.MathUtils.lerp(f.afterburner, 0.95, dt * 4);

          if (Math.random() < 0.35) {
            carrierToWorld(new THREE.Vector3(catX, 6.8, -13.0), tmpVec);
            spawnSmoke(tmpVec, new THREE.Vector3((Math.random() - 0.5) * 2, 1.6, 5), 0xe2e8f0, 0.8, 0.9);
          }

          if (f.stateTimer > 1.15) {
            f.state = 'LAUNCHING';
            f.stateTimer = 0;
            f.speed = 6.0;
            launchCount++;
            sound.playCatapultLaunch();
            updateStatsUI();
          }
        } else if (f.state === 'LAUNCHING') {
          if (f.catapult === 1) cat1Active = true;
          else cat2Active = true;

          // EMALS electromagnetic catapult acceleration (a = 48 m/s^2)
          f.speed += 52.0 * dt;
          f.localPos.z -= f.speed * dt;
          carrierToWorld(f.localPos, f.worldPos);
          m.root.position.copy(f.worldPos);
          m.root.rotation.copy(carrierObj.group.rotation);
          f.afterburner = 1.0;

          // Steam/vapor trail along catapult track
          if (Math.random() < 0.7) {
            spawnSmoke(
              f.worldPos.clone().add(new THREE.Vector3(0, 0.2, 2.5)),
              new THREE.Vector3((Math.random() - 0.5) * 2, 1.4, 3.0),
              0xf1f5f9,
              0.7,
              1.1
            );
          }

          if (f.localPos.z < -49.5) {
            f.state = 'CLIMBING';
            f.stateTimer = 0;
            f.vel.set(f.catapult === 1 ? 6 : -6, 10, -f.speed);
          }
        } else if (f.state === 'CLIMBING') {
          f.afterburner = THREE.MathUtils.lerp(f.afterburner, 0.85, dt * 2);
          // Smooth aerodynamic pitch-up and banking turn into patrol orbit
          const targetAlt = f.orbitAlt;
          const climbY = THREE.MathUtils.clamp((targetAlt - f.worldPos.y) * 0.55, 2.0, 22.0);
          const turnDir = f.catapult === 1 ? 1 : -1;
          f.vel.x = THREE.MathUtils.lerp(f.vel.x, turnDir * 24, dt * 0.7);
          f.vel.y = THREE.MathUtils.lerp(f.vel.y, climbY, dt * 1.4);
          f.vel.z = THREE.MathUtils.lerp(f.vel.z, -52, dt * 1.0);
          f.worldPos.addScaledVector(f.vel, dt);

          m.root.position.copy(f.worldPos);
          tmpVec.copy(f.worldPos).sub(f.vel);
          m.root.lookAt(tmpVec);
          m.root.rotateZ(-turnDir * 0.42);

          if (f.worldPos.y >= targetAlt - 3 || f.stateTimer > 4.2) {
            f.state = 'PATROL';
            f.stateTimer = 0;
            f.orbitAngle = Math.atan2(f.worldPos.z, f.worldPos.x);
          }
        } else if (f.state === 'PATROL') {
          f.afterburner = THREE.MathUtils.lerp(f.afterburner, 0.35, dt * 2);
          const angSpeed = 0.36;
          f.orbitAngle += angSpeed * dt;
          const targetX = Math.cos(f.orbitAngle) * f.orbitRadius;
          const targetZ = Math.sin(f.orbitAngle) * (f.orbitRadius * 1.25);
          const targetY = f.orbitAlt + Math.sin(elapsed * 0.7 + f.id) * 4.5;

          tmpVec.set(targetX, targetY, targetZ);
          const desired = tmpVec.sub(f.worldPos).normalize().multiplyScalar(58);
          f.vel.lerp(desired, dt * 2.2);
          f.worldPos.addScaledVector(f.vel, dt);

          m.root.position.copy(f.worldPos);
          tmpVec2.copy(f.worldPos).sub(f.vel);
          m.root.lookAt(tmpVec2);
          // Realistic bank into circular CAP orbit
          m.root.rotateZ(0.45);
        } else if (f.state === 'APPROACH') {
          // Line up aft of the angled flight deck (port-canted glideslope)
          f.afterburner = THREE.MathUtils.lerp(f.afterburner, 0.25, dt * 3);
          const progress = Math.min(1, f.stateTimer / 5.2);
          // Approach corridor from stern-starboard toward port-angled touchdown point
          const startLocal = new THREE.Vector3(14, 34, 170);
          const touchLocal = new THREE.Vector3(-4.2, 6.55, 22.0);
          tmpVec.lerpVectors(startLocal, touchLocal, progress);
          carrierToWorld(tmpVec, tmpVec2);

          const toTarget = tmpVec2.clone().sub(f.worldPos);
          const step = Math.min(toTarget.length(), (62 - progress * 24) * dt);
          if (toTarget.length() > 0.01) {
            toTarget.normalize();
            f.vel.lerp(toTarget.multiplyScalar(48), dt * 4.5);
          }
          f.worldPos.addScaledVector(f.vel, dt * 0.9);
          // Gently blend toward exact glideslope near touchdown
          if (progress > 0.55) {
            f.worldPos.lerp(tmpVec2, (progress - 0.55) * 0.18);
          }

          m.root.position.copy(f.worldPos);
          const lookPt = f.worldPos.clone().sub(f.vel);
          m.root.lookAt(lookPt);
          // Nose-up carrier flare attitude on final approach
          m.root.rotateX(0.11);

          if (progress >= 0.98 || f.worldPos.distanceTo(carrierToWorld(touchLocal, tmpVec)) < 3.5) {
            f.state = 'LANDING';
            f.stateTimer = 0;
            f.localPos.copy(touchLocal);
            f.speed = 36.0;
            trapCount++;
            sound.playTrapLanding();
            showToast(I18N[lang].msgTrap(f.callsign));
            updateStatsUI();

            // Tire smoke burst on touchdown
            carrierToWorld(touchLocal, tmpVec);
            for (let s = 0; s < 5; s++) {
              spawnSmoke(
                tmpVec.clone().add(new THREE.Vector3((Math.random() - 0.5) * 1.4, 0.2, 0)),
                new THREE.Vector3((Math.random() - 0.5) * 3, 1.5 + Math.random(), 2),
                0xdbeafe,
                0.75,
                1.0
              );
            }
          }
        } else if (f.state === 'LANDING') {
          // Arrestor wire rapid deceleration along angled deck (~9 deg port angle)
          f.afterburner = THREE.MathUtils.lerp(f.afterburner, 0.0, dt * 6);
          f.speed = Math.max(0, f.speed - 24.0 * dt);
          f.localPos.z -= f.speed * Math.cos(0.155) * dt;
          f.localPos.x -= f.speed * Math.sin(0.155) * dt;
          f.localPos.y = 6.45;
          carrierToWorld(f.localPos, f.worldPos);

          m.root.position.copy(f.worldPos);
          m.root.rotation.copy(carrierObj.group.rotation);
          m.root.rotateY(0.155);

          if (f.speed <= 0.5) {
            f.state = 'TAXI_PARK';
            f.stateTimer = 0;
          }
        } else if (f.state === 'TAXI_PARK') {
          const slot = PARKING_SLOTS[f.slotIndex];
          const target = new THREE.Vector3(slot.x, 6.45, slot.z);
          f.localPos.lerp(target, Math.min(1, dt * 1.6));
          carrierToWorld(f.localPos, f.worldPos);
          m.root.position.copy(f.worldPos);
          m.root.rotation.copy(carrierObj.group.rotation);
          m.root.rotateY(slot.rotY);

          if (f.localPos.distanceTo(target) < 0.7 || f.stateTimer > 3.2) {
            f.state = 'PARKED';
            f.stateTimer = 0;
            updateStatsUI();
          }
        }

        // Update afterburner visual glow
        const ab = f.afterburner;
        const flicker = 0.85 + Math.random() * 0.3;
        m.burnerMat.opacity = ab * 0.82;
        m.burnerCoreMat.opacity = ab * 0.92;
        m.burner.scale.set(0.8 + ab * 0.35, 0.7 + ab * 0.9 * flicker, 0.8 + ab * 0.35);
        m.burnerCore.scale.set(0.7 + ab * 0.3, 0.7 + ab * 0.8 * flicker, 0.7 + ab * 0.3);
      }

      // Animate Jet Blast Deflectors (JBDs) up when a catapult is hot
      carrierObj.jbd1.rotation.x = THREE.MathUtils.lerp(carrierObj.jbd1.rotation.x, cat1Active ? -0.82 : 0, dt * 5);
      carrierObj.jbd2.rotation.x = THREE.MathUtils.lerp(carrierObj.jbd2.rotation.x, cat2Active ? -0.82 : 0, dt * 5);
    }

    // =========================================================================
    // 10. INITIALIZE THREE.JS WORLD
    // =========================================================================
    function initScene() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(targetEnv.fogColor.getHex(), targetEnv.fogDensity);

      camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.5, 2600);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      container.appendChild(renderer.domElement);

      // Lights
      hemiLight = new THREE.HemisphereLight(targetEnv.hemiSky, targetEnv.hemiGround, targetEnv.hemiIntensity);
      scene.add(hemiLight);

      sunLight = new THREE.DirectionalLight(targetEnv.sunColor.getHex(), targetEnv.sunIntensity);
      sunLight.position.copy(targetEnv.sunDir).multiplyScalar(300);
      scene.add(sunLight);

      // Sky Dome
      const skyGeo = new THREE.SphereGeometry(1400, 32, 20);
      skyMat = new THREE.ShaderMaterial({
        vertexShader: SKY_VERTEX_SHADER,
        fragmentShader: SKY_FRAGMENT_SHADER,
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          uSunDir: { value: targetEnv.sunDir.clone() },
          uSkyTop: { value: targetEnv.skyTop.clone() },
          uSkyMid: { value: targetEnv.skyMid.clone() },
          uSkyHorizon: { value: targetEnv.skyHorizon.clone() },
          uSunColor: { value: targetEnv.sunColor.clone() },
          uTime: { value: 0 },
          uNightFactor: { value: targetEnv.nightFactor },
          uStormFactor: { value: targetEnv.stormFactor }
        }
      });
      scene.add(new THREE.Mesh(skyGeo, skyMat));

      // Custom GLSL Ocean
      const oceanGeo = new THREE.PlaneGeometry(2200, 2200, 160, 160);
      oceanGeo.rotateX(-Math.PI / 2);
      oceanMat = new THREE.ShaderMaterial({
        vertexShader: OCEAN_VERTEX_SHADER,
        fragmentShader: OCEAN_FRAGMENT_SHADER,
        uniforms: {
          uTime: { value: 0 },
          uSwell: { value: swellScale },
          uSunDir: { value: targetEnv.sunDir.clone() },
          uSunColor: { value: targetEnv.sunColor.clone() },
          uSkyHorizon: { value: targetEnv.skyHorizon.clone() },
          uSkyTop: { value: targetEnv.skyTop.clone() },
          uWaterDeep: { value: targetEnv.waterDeep.clone() },
          uWaterShallow: { value: targetEnv.waterShallow.clone() },
          uFogColor: { value: targetEnv.fogColor.clone() },
          uFogDensity: { value: targetEnv.fogDensity },
          uNightFactor: { value: targetEnv.nightFactor },
          uShips: {
            value: [
              new THREE.Vector4(0, 0, 48.0, 10.5),
              new THREE.Vector4(-92, -62, 22.0, 3.5),
              new THREE.Vector4(98, -48, 22.0, 3.5),
              new THREE.Vector4(-82, 86, 25.0, 3.8),
              new THREE.Vector4(88, 92, 25.0, 3.8),
              new THREE.Vector4(-168, 12, 22.0, 3.5),
              new THREE.Vector4(172, 24, 22.0, 3.5)
            ]
          },
          uRipples: { value: ripples }
        }
      });
      const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
      oceanMesh.name = 'ocean-surface';
      scene.add(oceanMesh);

      // Build CVN-78 Aircraft Carrier
      carrierObj = buildCarrier();
      scene.add(carrierObj.group);

      // Build 3 Escort Destroyers in Carrier Strike Group Formation
      const escortSpecs = [
        { x: -92,  z: -62, name: 'DDG-115', type: 'ddg' },
        { x: 98,   z: -48, name: 'DDG-118', type: 'ddg' },
        { x: -82,  z: 86,  name: 'CG-71',   type: 'cg'  },
        { x: 88,   z: 92,  name: 'CG-68',   type: 'cg'  },
        { x: -168, z: 12,  name: 'DDG-119', type: 'ddg' },
        { x: 172,  z: 24,  name: 'DDG-121', type: 'ddg' }
      ];
      escortSpecs.forEach((sp) => {
        const ship = sp.type === 'cg' ? buildCruiser() : buildDestroyer();
        ship.position.set(sp.x, 0, sp.z);
        scene.add(ship);
        escorts.push({ group: ship, baseX: sp.x, baseZ: sp.z, name: sp.name });
      });

      // Storm Rain Streaks (only visible during Storm preset)
      const rainCount = 900;
      const rainGeo = new THREE.BufferGeometry();
      const rainPos = new Float32Array(rainCount * 3);
      for (let i = 0; i < rainCount; i++) {
        rainPos[i * 3] = (Math.random() - 0.5) * 280;
        rainPos[i * 3 + 1] = Math.random() * 120;
        rainPos[i * 3 + 2] = (Math.random() - 0.5) * 280;
      }
      rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
      rainMat = new THREE.PointsMaterial({
        color: 0xcbe4f9,
        size: 0.75,
        transparent: true,
        opacity: 0.0
      });
      rainSystem = new THREE.Points(rainGeo, rainMat);
      scene.add(rainSystem);

      // Create Carrier Air Wing Fighters
      createFighters();

      // Add high-altitude orbiting E-2D Hawkeye AEW & Plane Guard MH-60R Seahawk
      hawkeyeObj = buildHawkeye();
      scene.add(hawkeyeObj.root);

      seahawkGuard = buildSeahawk();
      scene.add(seahawkGuard.root);

      // Park a Seahawk on CG-71's aft helipad
      const cgShip = escorts.find((e) => e.name === 'CG-71');
      if (cgShip) {
        const deckHelo = buildSeahawk();
        deckHelo.root.position.set(0, 2.82, 14.6);
        deckHelo.root.scale.set(0.88, 0.88, 0.88);
        cgShip.group.add(deckHelo.root);
      }

      // Resize Handler
      window.addEventListener('resize', onResize);
      setupPointerControls(renderer.domElement, oceanMesh);
    }

    function onResize() {
      const container = document.getElementById('canvas-container');
      if (!container || !camera || !renderer) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // =========================================================================
    // 11. INTERACTIVE ORBIT, ZOOM & 3D RAYCASTING (CLICK DECK / OCEAN / JETS)
    // =========================================================================
    function setupPointerControls(domEl, oceanMesh) {
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let isDown = false;
      let moved = false;
      let startX = 0, startY = 0;
      let lastX = 0, lastY = 0;
      let pinchStartDist = 0;

      domEl.addEventListener('pointerdown', (e) => {
        isDown = true;
        moved = false;
        startX = lastX = e.clientX;
        startY = lastY = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDown) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        if (Math.hypot(e.clientX - startX, e.clientY - startY) > 6) {
          moved = true;
        }
        lastX = e.clientX;
        lastY = e.clientY;

        if (cameraMode !== 'orbit') {
          setCameraMode('orbit');
        }
        orbit.targetTheta -= dx * 0.0065;
        orbit.targetPhi = THREE.MathUtils.clamp(orbit.targetPhi - dy * 0.0055, 0.22, 1.48);
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDown) return;
        isDown = false;
        if (moved) return;

        // Handle clean tap / click in 3D world
        const rect = domEl.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        // 1. Check Fighter Jets first
        const jetRoots = fighters.map((f) => f.model.root);
        const jetHits = raycaster.intersectObjects(jetRoots, true);
        if (jetHits.length > 0) {
          let obj = jetHits[0].object;
          while (obj.parent && !obj.name.startsWith('fighter-')) obj = obj.parent;
          const hitJet = fighters.find((f) => 'fighter-' + f.callsign === obj.name);
          if (hitJet) {
            trackedFighter = hitJet;
            setCameraMode('chase');
            showToast(I18N[lang].msgFollow(hitJet.callsign));
            return;
          }
        }

        // 2. Check Carrier Deck -> Launch Jet!
        const deckHits = raycaster.intersectObject(carrierObj.flightDeck, false);
        if (deckHits.length > 0) {
          launchFighter();
          return;
        }

        // 3. Check Ocean -> Create interactive physical wave ripple!
        const oceanHits = raycaster.intersectObject(oceanMesh, false);
        if (oceanHits.length > 0) {
          const pt = oceanHits[0].point;
          ripples[rippleIdx].set(pt.x, pt.z, oceanMat.uniforms.uTime.value, 1.0);
          rippleIdx = (rippleIdx + 1) % ripples.length;
          sound.playWaterPulse();
          showToast(I18N[lang].msgRipple);
        }
      });

      domEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (cameraMode !== 'orbit') setCameraMode('orbit');
        orbit.targetRadius = THREE.MathUtils.clamp(orbit.targetRadius + e.deltaY * 0.12, 42, 340);
      }, { passive: false });

      // Touch pinch-to-zoom support
      domEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      domEl.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDist > 0) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const delta = pinchStartDist - dist;
          pinchStartDist = dist;
          if (cameraMode !== 'orbit') setCameraMode('orbit');
          orbit.targetRadius = THREE.MathUtils.clamp(orbit.targetRadius + delta * 0.45, 42, 340);
        }
      }, { passive: true });
    }

    // =========================================================================
    // 12. SHIP BUOYANCY PHYSICS & CAMERA MODES
    // =========================================================================
    function applyShipBuoyancy(shipGroup, x, z, halfLen, halfBeam, time, damping) {
      const hBow = sampleOceanHeight(x, z - halfLen * 0.7, time, swellScale);
      const hStern = sampleOceanHeight(x, z + halfLen * 0.7, time, swellScale);
      const hPort = sampleOceanHeight(x - halfBeam, z, time, swellScale);
      const hStbd = sampleOceanHeight(x + halfBeam, z, time, swellScale);

      const avgY = (hBow + hStern + hPort + hStbd) * 0.25;
      const pitch = Math.atan2(hBow - hStern, halfLen * 1.4) * damping;
      const roll = Math.atan2(hPort - hStbd, halfBeam * 2.0) * damping;

      shipGroup.position.set(x, avgY, z);
      shipGroup.rotation.x = pitch;
      shipGroup.rotation.z = roll;
    }

    function updateCamera(dt, elapsed) {
      if (cameraMode === 'orbit') {
        orbit.theta = THREE.MathUtils.lerp(orbit.theta, orbit.targetTheta, dt * 6);
        orbit.phi = THREE.MathUtils.lerp(orbit.phi, orbit.targetPhi, dt * 6);
        orbit.radius = THREE.MathUtils.lerp(orbit.radius, orbit.targetRadius, dt * 6);

        const sinPhi = Math.sin(orbit.phi);
        const cx = orbit.targetPos.x + orbit.radius * sinPhi * Math.sin(orbit.theta);
        const cy = Math.max(4.5, orbit.targetPos.y + orbit.radius * Math.cos(orbit.phi));
        const cz = orbit.targetPos.z + orbit.radius * sinPhi * Math.cos(orbit.theta);

        camera.position.lerp(tmpVec.set(cx, cy, cz), dt * 7);
        camera.lookAt(orbit.targetPos);
      } else if (cameraMode === 'bridge') {
        // Dramatic Flight Deck Tower view right beside the island looking down the bow & angled runway
        const towerPos = carrierToWorld(new THREE.Vector3(11.5, 16.5, 18.0), tmpVec);
        const lookAtDeck = carrierToWorld(new THREE.Vector3(-2.5, 7.2, -32.0), tmpVec2);
        camera.position.lerp(towerPos, dt * 5);
        camera.lookAt(lookAtDeck);
      } else if (cameraMode === 'chase') {
        // Follow an active fighter (prefer an airborne jet if tracked jet is parked)
        if (!trackedFighter || trackedFighter.state === 'PARKED') {
          const active = fighters.find((f) => f.state !== 'PARKED');
          if (active) trackedFighter = active;
        }
        const f = trackedFighter || fighters[0];
        const backDir = f.vel.lengthSq() > 1 ? f.vel.clone().normalize().multiplyScalar(-18) : new THREE.Vector3(0, 0, 18);
        const desiredPos = f.worldPos.clone().add(backDir).add(new THREE.Vector3(0, 6.2, 0));
        desiredPos.y = Math.max(5.5, desiredPos.y);
        camera.position.lerp(desiredPos, dt * 4.5);
        camera.lookAt(f.worldPos);
      } else if (cameraMode === 'convoy') {
        // Wide cinematic sweeping view showing the entire Carrier Strike Group
        const sweepAngle = 0.55 + Math.sin(elapsed * 0.12) * 0.35;
        const cx = Math.sin(sweepAngle) * 275;
        const cz = Math.cos(sweepAngle) * 245 - 10;
        camera.position.lerp(tmpVec.set(cx, 84, cz), dt * 3.5);
        camera.lookAt(0, 6, 8);
      }
    }

    // =========================================================================
    // 13. MAIN ANIMATION LOOP
    // =========================================================================
    let animId = null;
    let lastTime = 0;
    let simTime = 0;

    function animate(now) {
      animId = requestAnimationFrame(animate);
      const dt = Math.min(0.05, lastTime ? (now - lastTime) / 1000 : 0.016);
      lastTime = now;
      simTime += dt;

      // Smoothly interpolate environment lighting & shader uniforms
      const lerpRate = dt * 2.2;
      skyMat.uniforms.uTime.value = simTime;
      skyMat.uniforms.uSunDir.value.lerp(targetEnv.sunDir, lerpRate).normalize();
      skyMat.uniforms.uSkyTop.value.lerp(targetEnv.skyTop, lerpRate);
      skyMat.uniforms.uSkyMid.value.lerp(targetEnv.skyMid, lerpRate);
      skyMat.uniforms.uSkyHorizon.value.lerp(targetEnv.skyHorizon, lerpRate);
      skyMat.uniforms.uSunColor.value.lerp(targetEnv.sunColor, lerpRate);
      skyMat.uniforms.uNightFactor.value = THREE.MathUtils.lerp(skyMat.uniforms.uNightFactor.value, targetEnv.nightFactor, lerpRate);
      skyMat.uniforms.uStormFactor.value = THREE.MathUtils.lerp(skyMat.uniforms.uStormFactor.value, targetEnv.stormFactor, lerpRate);

      oceanMat.uniforms.uTime.value = simTime;
      oceanMat.uniforms.uSwell.value = THREE.MathUtils.lerp(oceanMat.uniforms.uSwell.value, swellScale, dt * 3.5);
      oceanMat.uniforms.uSunDir.value.copy(skyMat.uniforms.uSunDir.value);
      oceanMat.uniforms.uSunColor.value.copy(skyMat.uniforms.uSunColor.value);
      oceanMat.uniforms.uSkyHorizon.value.copy(skyMat.uniforms.uSkyHorizon.value);
      oceanMat.uniforms.uSkyTop.value.copy(skyMat.uniforms.uSkyTop.value);
      oceanMat.uniforms.uWaterDeep.value.lerp(targetEnv.waterDeep, lerpRate);
      oceanMat.uniforms.uWaterShallow.value.lerp(targetEnv.waterShallow, lerpRate);
      oceanMat.uniforms.uFogColor.value.lerp(targetEnv.fogColor, lerpRate);
      oceanMat.uniforms.uFogDensity.value = THREE.MathUtils.lerp(oceanMat.uniforms.uFogDensity.value, targetEnv.fogDensity, lerpRate);
      oceanMat.uniforms.uNightFactor.value = skyMat.uniforms.uNightFactor.value;

      scene.fog.color.copy(oceanMat.uniforms.uFogColor.value);
      scene.fog.density = oceanMat.uniforms.uFogDensity.value;

      // Occasional storm lightning flash
      if (currentEnv === 'storm' && Math.random() < 0.004) {
        lightningFlash = 1.0;
      }
      lightningFlash = Math.max(0, lightningFlash - dt * 4.5);

      sunLight.position.copy(skyMat.uniforms.uSunDir.value).multiplyScalar(300);
      sunLight.color.copy(skyMat.uniforms.uSunColor.value);
      sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, targetEnv.sunIntensity, lerpRate) + lightningFlash * 2.2;
      hemiLight.intensity = THREE.MathUtils.lerp(hemiLight.intensity, targetEnv.hemiIntensity, lerpRate) + lightningFlash * 0.6;

      // Carrier night / storm deck lights & island glow
      const glowStrength = Math.max(skyMat.uniforms.uNightFactor.value, skyMat.uniforms.uStormFactor.value * 0.7);
      carrierObj.deckFlood.intensity = glowStrength * 2.6;
      carrierObj.bridgeWinMat.emissiveIntensity = 0.25 + glowStrength * 1.4;
      carrierObj.beacon.visible = Math.sin(simTime * 5.0) > 0.0;

      // Subtle deck crew movement
      for (let i = 0; i < carrierObj.crewList.length; i++) {
        const c = carrierObj.crewList[i];
        c.mesh.position.z = c.baseZ + Math.sin(simTime * 0.9 + c.phase) * 0.65;
      }

      // Rain animation in Storm mode
      if (rainSystem && rainMat) {
        rainMat.opacity = THREE.MathUtils.lerp(rainMat.opacity, currentEnv === 'storm' ? 0.55 : 0.0, dt * 3);
        if (rainMat.opacity > 0.02) {
          const pos = rainSystem.geometry.attributes.position.array;
          for (let i = 0; i < pos.length; i += 3) {
            pos[i + 1] -= 95 * dt;
            pos[i + 2] += 18 * dt;
            if (pos[i + 1] < 0) {
              pos[i + 1] = 115;
              pos[i + 2] = (Math.random() - 0.5) * 280;
            }
          }
          rainSystem.geometry.attributes.position.needsUpdate = true;
        }
      }

      // Ship Buoyancy Physics (Carrier is heavy & stable; Destroyers pitch/roll more)
      applyShipBuoyancy(carrierObj.group, 0, 0, 48, 11, simTime, 0.42);
      carrierObj.group.updateMatrixWorld();

      escorts.forEach((es, idx) => {
        const swayX = es.baseX + Math.sin(simTime * 0.22 + idx * 2.0) * 1.8;
        const swayZ = es.baseZ + Math.cos(simTime * 0.18 + idx) * 2.2;
        applyShipBuoyancy(es.group, swayX, swayZ, 19, 3.2, simTime, 0.85);
        oceanMat.uniforms.uShips.value[idx + 1].x = swayX;
        oceanMat.uniforms.uShips.value[idx + 1].y = swayZ;
      });

      // Autonomous Relaxed Flight Operations Cycle
      if (autoOps) {
        autoTimer -= dt;
        if (autoTimer <= 0) {
          autoTimer = 6.2;
          const airborneCount = fighters.filter(
            (f) => f.state === 'PATROL' || f.state === 'CLIMBING' || f.state === 'LAUNCHING'
          ).length;
          if (airborneCount < 3 && Math.random() < 0.62) {
            const parked = fighters.find((f) => f.state === 'PARKED');
            if (parked) launchFighter(parked);
          } else if (airborneCount >= 2) {
            recoverFighter();
          }
        }
      }

      updateFighters(dt, simTime);

      // Animate E-2D Hawkeye high AEW overwatch orbit + spinning rotodome
      if (hawkeyeObj) {
        const hAng = simTime * 0.16 + 1.2;
        const hx = Math.cos(hAng) * 185;
        const hz = Math.sin(hAng) * 215;
        const hy = 78 + Math.sin(simTime * 0.4) * 2.5;
        const nextHx = Math.cos(hAng + 0.05) * 185;
        const nextHz = Math.sin(hAng + 0.05) * 215;
        hawkeyeObj.root.position.set(hx, hy, hz);
        // Remember: Object3D.lookAt aligns +Z to target, nose is -Z, so look behind heading
        hawkeyeObj.root.lookAt(hx - (nextHx - hx), hy, hz - (nextHz - hz));
        hawkeyeObj.root.rotateZ(0.18);
        hawkeyeObj.rotodome.rotation.y += dt * 2.6;
        hawkeyeObj.props.forEach((p) => { p.rotation.z += dt * 18.0; });
      }

      // Animate MH-60R Seahawk Plane Guard hovering/cruising alongside CVN-78 starboard beam
      if (seahawkGuard) {
        const sAng = simTime * 0.25;
        const sx = 34 + Math.cos(sAng) * 14;
        const sz = 12 + Math.sin(sAng) * 32;
        const sy = 15.5 + Math.sin(simTime * 1.3) * 1.2;
        seahawkGuard.root.position.set(sx, sy, sz);
        seahawkGuard.root.rotation.set(0.06, Math.sin(sAng) * 0.18, -Math.cos(sAng) * 0.08);
        seahawkGuard.mainRotor.rotation.y += dt * 22.0;
        seahawkGuard.tailRotor.rotation.x += dt * 28.0;
      }

      updateParticles(dt);
      updateCamera(dt, simTime);
      sound.updateAmbience(swellScale, currentEnv === 'storm');

      renderer.render(scene, camera);
    }

    // =========================================================================
    // 14. UI BINDINGS
    // =========================================================================
    function setCameraMode(mode) {
      cameraMode = mode;
      document.querySelectorAll('.cam-btn').forEach((btn) => {
        btn.classList.toggle('btn-active', btn.dataset.cam === mode);
      });
    }

    function setEnvironment(envKey) {
      if (!ENVS[envKey]) return;
      currentEnv = envKey;
      targetEnv = ENVS[envKey];
      swellScale = targetEnv.defaultSwell;
      const slider = document.getElementById('slider-swell');
      if (slider) slider.value = String(swellScale);
      document.querySelectorAll('.env-btn').forEach((btn) => {
        btn.classList.toggle('btn-active', btn.dataset.env === envKey);
      });
    }

    function bindUI() {
      document.getElementById('btn-launch').addEventListener('click', () => launchFighter());
      document.getElementById('btn-recover').addEventListener('click', () => recoverFighter());
      document.getElementById('btn-scramble').addEventListener('click', () => scrambleWing());

      document.querySelectorAll('.cam-btn').forEach((btn) => {
        btn.addEventListener('click', () => setCameraMode(btn.dataset.cam));
      });

      document.querySelectorAll('.env-btn').forEach((btn) => {
        btn.addEventListener('click', () => setEnvironment(btn.dataset.env));
      });

      document.getElementById('slider-swell').addEventListener('input', (e) => {
        swellScale = parseFloat(e.target.value) || 1.0;
      });

      document.getElementById('btn-auto').addEventListener('click', () => {
        autoOps = !autoOps;
        const btn = document.getElementById('btn-auto');
        const dot = document.getElementById('auto-dot');
        btn.classList.toggle('btn-active', autoOps);
        dot.classList.toggle('bg-emerald-400', autoOps);
        dot.classList.toggle('animate-pulse', autoOps);
        dot.classList.toggle('bg-slate-500', !autoOps);
      });

      document.getElementById('btn-sound').addEventListener('click', () => {
        const next = !sound.enabled;
        sound.setEnabled(next);
        document.getElementById('sound-icon').textContent = next ? '🔊' : '🔇';
        document.getElementById('btn-sound').classList.toggle('btn-active', next);
        applyLanguage();
      });

      document.getElementById('btn-lang').addEventListener('click', () => {
        lang = lang === 'en' ? 'zh' : 'en';
        try { localStorage.setItem('cvn78_lang', lang); } catch (e) {}
        applyLanguage();
      });

      const bottomHud = document.getElementById('bottom-hud');
      const headerEl = document.querySelector('header');
      const showBtn = document.getElementById('btn-show-hud');

      document.getElementById('btn-hud').addEventListener('click', () => {
        bottomHud.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
        headerEl.classList.add('opacity-0', 'pointer-events-none');
        showBtn.classList.remove('hidden');
      });

      showBtn.addEventListener('click', () => {
        bottomHud.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
        headerEl.classList.remove('opacity-0', 'pointer-events-none');
        showBtn.classList.add('hidden');
      });

      // Keyboard shortcuts for desktop convenience
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          launchFighter();
        } else if (e.key === 'l' || e.key === 'L') {
          recoverFighter();
        } else if (e.key === '1') {
          setCameraMode('orbit');
        } else if (e.key === '2') {
          setCameraMode('bridge');
        } else if (e.key === '3') {
          setCameraMode('chase');
        } else if (e.key === '4') {
          setCameraMode('convoy');
        }
      });
    }

    window.onload = function () {
      if (animId) cancelAnimationFrame(animId);
      initScene();
      bindUI();
      applyLanguage();
      animate(0);
    };
  })();
  </script>
