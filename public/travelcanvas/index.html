<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelCanvas — Multiplayer Travel Workspace</title>
    <style>
        :root {
            --bg-topbar: #0b1120;
            --bg-upper-canvas: #f8fafc;
            --bg-lower-spine: #0f172a;
            --bg-day-slot: #131c2e;
            --border-light: #e2e8f0;
            --border-dark: #1e293b;
            --teal-accent: #14b8a6;
            --teal-hover: #0d9488;
            --amber-btn: #f59e0b;
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif; }
        body { background: var(--bg-topbar); color: var(--text-light); height: 100vh; overflow: hidden; user-select: none; }
        button { cursor: pointer; border: none; font-weight: 600; border-radius: 8px; transition: 0.15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
        input, textarea, select { background: #ffffff; border: 1px solid #cbd5e1; color: var(--text-dark); border-radius: 8px; padding: 9px 12px; font-size: 13px; width: 100%; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: var(--teal-accent); box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.2); }

        /* Lobby & Nickname Screens */
        .center-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%); position: relative; }
        .auth-card { background: #ffffff; color: var(--text-dark); border: 1px solid var(--border-light); border-radius: 20px; padding: 32px; width: 100%; max-width: 440px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .logo-title { font-size: 38px; font-weight: 900; background: linear-gradient(90deg, #14b8a6, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .floating-lang { position: absolute; top: 20px; right: 24px; }

        /* Top Toolbar */
        .topbar { height: 60px; background: var(--bg-topbar); border-bottom: 1px solid var(--border-dark); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; z-index: 100; position: relative; }
        .bar-group { display: flex; align-items: center; gap: 10px; }
        .room-pill { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.4); padding: 3px 10px; border-radius: 6px; font-family: monospace; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .sync-badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
        .sync-saved { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .sync-saving { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .sync-error { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .btn-new-card { background: var(--teal-accent); color: #ffffff; padding: 8px 16px; font-size: 13px; font-weight: 700; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
        .btn-new-card:hover { background: var(--teal-hover); }
        .btn-tool { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 7px 12px; font-size: 12px; white-space: nowrap; }
        .btn-tool:hover, .btn-tool.active { border-color: var(--teal-accent); color: #2dd4bf; background: rgba(20, 184, 166, 0.15); }
        .btn-lang { background: #0f172a; border: 1px solid #334155; color: #38bdf8; padding: 6px 11px; font-size: 12px; font-weight: 800; letter-spacing: 0.03em; white-space: nowrap; }
        .btn-lang:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.12); }
        .btn-amber { background: var(--amber-btn); color: #090d16; padding: 8px 14px; font-size: 12px; font-weight: 700; white-space: nowrap; }

        /* Split Workspace Viewport */
        .workspace-scroll { height: calc(100vh - 60px); overflow-y: auto; overflow-x: auto; display: flex; flex-direction: column; }

        /* Upper Freeform Idea Canvas */
        .upper-canvas { position: relative; min-width: 1400px; min-height: 430px; flex-shrink: 0; background-color: var(--bg-upper-canvas); background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px); background-size: 24px 24px; border-bottom: 4px solid var(--teal-accent); padding: 16px 24px; }
        .canvas-banner-row { display: flex; justify-content: space-between; align-items: center; pointer-events: none; margin-bottom: 8px; }
        .canvas-pill-hint { background: rgba(255, 255, 255, 0.92); border: 1px solid #cbd5e1; color: #475569; padding: 5px 12px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* Lower Central Timeline Spine */
        .lower-spine { min-width: 1400px; flex: 1; background-color: var(--bg-lower-spine); padding: 20px 24px 40px; display: flex; flex-direction: column; }
        .spine-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .spine-badge { background: var(--teal-accent); color: #042f2e; font-size: 11px; font-weight: 900; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
        .days-row { display: flex; gap: 18px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }

        /* Day Column & Editable Day Header */
        .day-slot { min-width: 310px; width: 310px; background: var(--bg-day-slot); border: 1px solid #1e293b; border-radius: 14px; padding: 14px; min-height: 360px; display: flex; flex-direction: column; transition: border-color 0.15s; }
        .day-slot.drag-over { border-color: var(--teal-accent); box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.35); }
        .day-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #1e293b; }
        .day-head-left { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; border-radius: 6px; padding: 2px 4px; transition: background 0.15s; }
        .day-head-left:hover { background: rgba(255, 255, 255, 0.06); }
        .day-num-circle { width: 24px; height: 24px; border-radius: 50%; background: var(--teal-accent); color: #042f2e; font-weight: 900; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .day-name { font-weight: 800; font-size: 14px; color: #ffffff; display: flex; align-items: center; gap: 6px; }
        .day-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        .day-actions { display: flex; gap: 4px; }
        .day-icon-btn { width: 24px; height: 24px; border-radius: 6px; background: #1e293b; color: #94a3b8; font-size: 12px; }
        .day-icon-btn:hover { background: #334155; color: white; }

        /* Crisp White Cards with Colorful Category Headers */
        .travel-card { width: 280px; background: #ffffff; color: var(--text-dark); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.18), 0 0 0 1px #e2e8f0; transition: transform 0.18s ease, box-shadow 0.18s ease, margin 0.18s ease; user-select: none; }
        .travel-card.floating { position: absolute; cursor: grab; z-index: 30; }
        .travel-card.floating:active { cursor: grabbing; box-shadow: 0 20px 35px -5px rgba(15, 23, 42, 0.35); transform: scale(1.02); z-index: 90; }
        .travel-card.scheduled { width: 100%; position: relative; cursor: grab; margin-bottom: 12px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35); }

        /* Colorful Category Header Bars */
        .card-header-bar { height: 38px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; color: #ffffff; font-weight: 700; font-size: 13px; }
        .header-Food { background: linear-gradient(90deg, #f97316, #ea580c); }
        .header-Stay { background: linear-gradient(90deg, #6366f1, #4f46e5); }
        .header-Activity { background: linear-gradient(90deg, #10b981, #059669); }
        .header-Transport { background: linear-gradient(90deg, #0284c7, #0369a1); }
        .header-Note { background: linear-gradient(90deg, #f59e0b, #d97706); }

        .card-header-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 165px; display: flex; align-items: center; gap: 6px; }
        .card-header-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .header-pill-btn { background: rgba(0, 0, 0, 0.22); color: #ffffff; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .header-pill-btn:hover { background: rgba(0, 0, 0, 0.4); }

        .card-photo-wrap { width: 100%; height: 132px; overflow: hidden; background: #f1f5f9; border-bottom: 1px solid #f1f5f9; position: relative; }
        .card-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }

        .card-body-content { padding: 12px; }
        .card-memo { font-size: 12px; color: #334155; line-height: 1.45; white-space: pre-wrap; margin-bottom: 10px; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 8px; font-size: 11px; color: #64748b; gap: 6px; }
        .day-select-mini { width: auto; padding: 3px 6px; font-size: 11px; border-radius: 6px; background: #f8fafc; border: 1px solid #cbd5e1; color: #0f172a; font-weight: 600; cursor: pointer; }
        .edit-dark-btn { background: #0f172a; color: #ffffff; padding: 4px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; }
        .edit-dark-btn:hover { background: #334155; }

        /* Rolodex Peek-a-Boo Stacking */
        .day-cards.rolodex .travel-card.scheduled:not(:first-child) { margin-top: -145px; }
        .day-cards.rolodex .travel-card.scheduled:hover { transform: translateY(-6px); z-index: 50; margin-bottom: 135px; box-shadow: 0 18px 32px rgba(0,0,0,0.65); }

        /* Modals & Paste Dropzone */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(9, 13, 22, 0.72); display: flex; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(3px); }
        .modal-box { background: #ffffff; color: var(--text-dark); border-radius: 16px; padding: 24px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); max-height: 92vh; overflow-y: auto; }
        .modal-label { font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 4px; display: block; }
        .paste-zone { border: 2px dashed #94a3b8; background: #f8fafc; border-radius: 10px; padding: 12px; text-align: center; font-size: 12px; color: #475569; transition: 0.15s; cursor: pointer; position: relative; }
        .paste-zone:hover, .paste-zone.paste-active { border-color: var(--teal-accent); background: #f0fdfa; color: #0f766e; }
        .photo-preview-box { margin-top: 8px; position: relative; height: 110px; border-radius: 8px; overflow: hidden; border: 1px solid #cbd5e1; background: #f1f5f9; }
        .photo-preview-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .clear-photo-btn { position: absolute; top: 6px; right: 6px; background: rgba(15, 23, 42, 0.8); color: white; font-size: 11px; padding: 3px 8px; border-radius: 6px; }

        /* Print Unfolded Itinerary */
        @media print {
            body, .workspace-scroll, .lower-spine { height: auto !important; overflow: visible !important; background: white !important; color: black !important; min-width: 100% !important; }
            .topbar, .upper-canvas, .no-print { display: none !important; }
            .days-row { display: block !important; }
            .day-slot { width: 100% !important; border: 1px solid #cbd5e1 !important; background: white !important; margin-bottom: 20px !important; page-break-inside: avoid; }
            .day-name { color: black !important; }
            .day-cards.rolodex .travel-card.scheduled:not(:first-child) { margin-top: 10px !important; }
            .travel-card.scheduled { box-shadow: none !important; border: 1px solid #cbd5e1 !important; page-break-inside: avoid; }
        }
    </style>
</head>

                exportPdfBtn: '匯出展開版 PDF',
                upperHint1: '✨ 未排程靈感畫布 — 雙擊空白處新增卡片，或將卡片拖曳至下方時間軸',
                upperHint2: '防重疊保護開啟：堆疊卡片時永遠完整保留彩色標題列',

                photoLabel: '照片 (支援剪貼簿貼上、上傳檔案或貼上圖片網址)',
                pasteHint: '📋 在此視窗直接按 Cmd+V / Ctrl+V，即可貼上剪貼簿中的截圖或照片！',

                untitledTrip: '全新好友旅程'

        };

        let state = {
            lang: localStorage.getItem('travelcanvas_lang') || 'en',
            view: 'lobby',
            projectCode: '',
            tripTitle: 'New Friends Trip',
            username: localStorage.getItem('travelcanvas_nickname') || '',
            syncStatus: 'saved',
            rolodexMode: false,
            cardModalOpen: false,
            editingCardId: null,
            tempPhotoData: '',
            justPasted: false,
            dayModalOpen: false,
            editingDayId: null,
            days: [
                { id: 'd1', label: 'Day 1', date: 'Click ✎ to set date & area' },
                { id: 'd2', label: 'Day 2', date: 'Click ✎ to set date & area' },
                { id: 'd3', label: 'Day 3', date: 'Click ✎ to set date & area' }
            ],
            cards: []
        };

        let unsubscribe = null;
        let authReadyPromise = signInAnonymously(auth).catch(console.error);

        function t(key) {
            return (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key;
        }

        function toggleLang() {
            state.lang = state.lang === 'en' ? 'zh' : 'en';
            localStorage.setItem('travelcanvas_lang', state.lang);
            render();
        }

        function esc(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function compressImageDataUrl(dataUrl, callback) {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxW = 550;
                const scale = Math.min(1, maxW / img.width);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.75));
            };
            img.src = dataUrl;
        }

        // Global Clipboard Paste Listener when Card Modal is Open
        window.addEventListener('paste', (e) => {
            if (!state.cardModalOpen) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData)?.items;
            if (!items) return;

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (item.type.indexOf('image') !== -1) {
                    e.preventDefault();
                    const blob = item.getAsFile();
                    if (!blob) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        compressImageDataUrl(ev.target.result, (compressed) => {
                            state.tempPhotoData = compressed;
                            state.justPasted = true;
                            updateModalPhotoPreview();
                        });
                    };
                    reader.readAsDataURL(blob);
                    break;
                }
            }
        });

        function updateModalPhotoPreview() {
            const urlInput = document.getElementById('modalCardPhotoUrl');
            const pasteZone = document.getElementById('modalPasteZone');
            const previewContainer = document.getElementById('modalPhotoPreviewWrap');
            if (urlInput) urlInput.value = state.tempPhotoData;
            if (pasteZone && state.justPasted) {
                pasteZone.classList.add('paste-active');
                pasteZone.textContent = t('pasteConfirmed');
            }
            if (previewContainer) {
                if (state.tempPhotoData) {

        function makeDraggable(el, card) {
            let startX = 0, startY = 0, origX = card.x || 50, origY = card.y || 55, dragging = false;

            el.onmousedown = (e) => {
                if (['BUTTON', 'SELECT', 'INPUT'].includes(e.target.tagName)) return;
                dragging = true;
                startX = e.clientX;
                startY = e.clientY;
                origX = parseFloat(el.style.left) || 50;
                origY = parseFloat(el.style.top) || 55;

                const onMove = (me) => {
                    if (!dragging) return;
                    if (!card.dayId) {
                        const nx = Math.max(16, origX + (me.clientX - startX));
                        const ny = Math.max(44, origY + (me.clientY - startY));
                        el.style.left = nx + 'px';
                        el.style.top = ny + 'px';
                    }
                    document.querySelectorAll('.day-slot').forEach(slot => {
                        const r = slot.getBoundingClientRect();
                        if (me.clientX >= r.left && me.clientX <= r.right && me.clientY >= r.top && me.clientY <= r.bottom) {
                            slot.classList.add('drag-over');
                        } else {
                            slot.classList.remove('drag-over');
                        }
                    });
                };

                const onUp = async (ue) => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (!dragging) return;
                    dragging = false;

                    let droppedDayId = null;
                    document.querySelectorAll('.day-slot').forEach(slot => {
                        slot.classList.remove('drag-over');
                        const r = slot.getBoundingClientRect();
                        if (ue.clientX >= r.left && ue.clientX <= r.right && ue.clientY >= r.top && ue.clientY <= r.bottom) {
                            droppedDayId = slot.getAttribute('data-day-id');
                        }
                    });

                    if (droppedDayId) {
                        await assignToDay(card.id, droppedDayId);
                    } else if (!card.dayId) {
                        const finalX = Math.round(parseFloat(el.style.left));
                        const finalY = Math.round(parseFloat(el.style.top));
                        state.cards = state.cards.map(c => c.id === card.id ? { ...c, x: finalX, y: finalY } : c);
                        await syncFirestore();
                    }
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            };
        }

                    trip_title: 'Kyoto & Osaka Autumn Friends Trip',
                    created_at: new Date().toISOString(),
                    days: [
                        { id: 'd1', label: 'Day 1', date: 'Nov 18 · Arrival & Gion' },
                        { id: 'd2', label: 'Day 2', date: 'Nov 19 · Arashiyama & West' },
                        { id: 'd3', label: 'Day 3', date: 'Nov 20 · Fushimi & Osaka' }
                    ],
                    cards: [
                        {
                            id: 'c1',
                            title: 'Nishiki Market Food Crawl',
                            body: 'Unscheduled idea! Try tamagoyaki, matcha warabimochi, and grilled skewered seafood. Best between 11am and 3pm.',
                            category: 'Food',
                            photo: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80',
                            creator: 'Alex',
                            upvotes: ['Alex', 'JC'],
                            dayId: null,
                            x: 55,
                            y: 62
                        },
                        {
                            id: 'c2',
                            title: 'Packing & SIM Card Memo',
                            body: '1. Download Ubigi or Airalo eSIM before flying.\n2. Add digital Suica card to Apple Wallet.\n3. Bring comfortable walking shoes (20k steps/day).',
                            category: 'Note',
                            photo: '',
                            creator: 'Alex',
                            upvotes: ['Alex', 'Sam', 'JC'],
                            dayId: null,
                            x: 370,
                            y: 52
                        },
                        {
                            id: 'c3',
                            title: 'Backup Hotel: Piece Hostel Sanjo',
                            body: 'Great design hostel in downtown Kyoto in case we want to stay closer to Nishiki Market.',
                            category: 'Stay',
                            photo: '',
                            creator: 'Sam',
                            upvotes: ['Sam'],
                            dayId: null,
                            x: 685,
                            y: 52
                        },
                        {
                            id: 'c4',
                            title: 'Kansai Express Haruka to Kyoto',
                            body: 'Direct train from KIX Airport to Kyoto Station (75 mins). Book ICOCA + Haruka discount pass in advance so we do not wait in line.',
                            category: 'Transport',
                            photo: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=600&q=80',
                            creator: 'Alex',
                            upvotes: ['Alex', 'Sam', 'JC'],
                            dayId: 'd1'
                        },
                        {
                            id: 'c5',
                            title: 'Arashiyama Bamboo Grove (7 AM)',
                            body: 'Reddit says we MUST arrive before 7:00 AM or it is wall-to-wall tourists. Afterwards we can grab Arabica coffee right by the Togetsukyo Bridge.',
                            category: 'Activity',
                            photo: 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=600&q=80',
                            creator: 'Sam',
                            upvotes: ['Sam', 'JC', 'Alex'],
                            dayId: 'd2'
                        }
                    ]
                };
                await setDoc(doc(db, "projects", code), sampleData);
            }

            await enterExistingRoom(code);
        }

        async function enterExistingRoom(code) {
            await authReadyPromise;
            const snap = await getDoc(doc(db, "projects", code));
            if (!snap.exists()) {
                await createBlankRoom(code, code);
                return;
            }
            const data = snap.data();
            state.projectCode = code;
            state.tripTitle = data.trip_title || code;
            state.days = data.days || state.days;
            state.cards = data.cards || [];
            window.location.hash = code;
            state.view = state.username ? 'workspace' : 'username';
            if (state.view === 'workspace') subscribeToRoom(code);
            render();
        }

        function launchCanvas(name) {
            state.username = name;
            localStorage.setItem('travelcanvas_nickname', name);
            state.view = 'workspace';
            subscribeToRoom(state.projectCode);
            render();
        }

        function subscribeToRoom(code) {
            if (unsubscribe) unsubscribe();
            unsubscribe = onSnapshot(doc(db, "projects", code), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    state.tripTitle = data.trip_title || state.tripTitle;
                    state.cards = Array.isArray(data.cards) ? data.cards : [];
                    if (Array.isArray(data.days) && data.days.length) state.days = data.days;
                    if (state.view === 'workspace') render();
                }
            });
        }

        async function syncFirestore() {
            if (!state.projectCode) return;
            state.syncStatus = 'saving';
            render();
            try {
                await authReadyPromise;
                await setDoc(doc(db, "projects", state.projectCode), {
                    project_code: state.projectCode,
                    trip_title: state.tripTitle,
                    days: state.days,
                    cards: state.cards,
                    updated_at: new Date().toISOString()
                }, { merge: true });
                state.syncStatus = 'saved';
                render();
            } catch (err) {
                console.error("Auto-save failed:", err);
                state.syncStatus = 'error';
                render();
            }
        }

        async function saveCardFromModal() {
            const title = document.getElementById('modalCardTitle').value.trim();
            const category = document.getElementById('modalCardCat').value;
            const photo = state.tempPhotoData || document.getElementById('modalCardPhotoUrl').value.trim();
            const body = document.getElementById('modalCardBody').value.trim();
            if (!title) return;

            if (state.editingCardId) {
                state.cards = state.cards.map(c => c.id === state.editingCardId ? { ...c, title, category, photo, body } : c);
            } else {
                const count = state.cards.filter(c => !c.dayId).length;
                state.cards.push({
                    id: 'c_' + Date.now(),
                    title,
                    category,
                    photo,
                    body,
                    creator: state.username || 'Planner',
                    upvotes: [state.username || 'Planner'],
                    dayId: state.preAssignDayId || null,
                    x: 55 + (count * 305) % 920,
                    y: 55 + Math.floor(count / 3) * 80
                });
            }
            state.cardModalOpen = false;
            state.editingCardId = null;
            state.preAssignDayId = null;
            state.tempPhotoData = '';
            state.justPasted = false;
            await syncFirestore();
        }

        async function saveDayHeaderFromModal() {
            const label = document.getElementById('modalDayLabel').value.trim();
            const date = document.getElementById('modalDayDate').value.trim();
            if (!label) return;
            state.days = state.days.map(d => d.id === state.editingDayId ? { ...d, label, date } : d);
            state.dayModalOpen = false;
            state.editingDayId = null;
            await syncFirestore();
        }

        async function assignToDay(cardId, dayId) {
            state.cards = state.cards.map(c => c.id === cardId ? { ...c, dayId } : c);
            await syncFirestore();
        }

        async function toggleVote(cardId) {
            state.cards = state.cards.map(c => {
                if (c.id !== cardId) return c;
                const list = Array.isArray(c.upvotes) ? [...c.upvotes] : [];
                const idx = list.indexOf(state.username);
                if (idx >= 0) list.splice(idx, 1);
                else list.push(state.username);
                return { ...c, upvotes: list };
            });
            await syncFirestore();
        }

        async function deleteCard(cardId) {
            state.cards = state.cards.filter(c => c.id !== cardId);
            await syncFirestore();
        }

        async function addDayColumn() {
            const n = state.days.length + 1;
            state.days.push({ id: 'd_' + Date.now(), label: `Day ${n}`, date: t('newDayDefaultSub') });
            await syncFirestore();
        }

        async function deleteDayColumn(dayId) {
            state.days = state.days.filter(d => d.id !== dayId);
            state.cards = state.cards.map(c => c.dayId === dayId ? { ...c, dayId: null } : c);
            await syncFirestore();
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify({ projectCode: state.projectCode, tripTitle: state.tripTitle, days: state.days, cards: state.cards }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${state.projectCode}-canvas.json`;
            a.click();
        }

        const initialHash = window.location.hash.replace('#', '').trim().toUpperCase();
        if (initialHash) {
            enterExistingRoom(initialHash);
        } else {
            render();
        }
    </script>
</body>
